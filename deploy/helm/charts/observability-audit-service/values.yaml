# observability-audit-service — leave image.repository/tag/pullPolicy and replicaCount/resources
# empty to inherit umbrella global.* values. Set them here only to override
# the umbrella for this one subchart.

enabled: true

replicaCount: ""

image:
  repository: ""
  tag: ""
  pullPolicy: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

env: []

dapr:
  enabled: true
  appPort: 8080
  appProtocol: http
  logLevel: info

serviceMonitor:
  enabled: false

# NetworkPolicy (DEPLOY-IMPL-009) — this service's slice of the design
# Networking allow matrix. Pairs with the umbrella deny-all.
# `enabled: null` inherits the umbrella `global.networkPolicies.enabled`;
# set true/false here to override this one service. Shared plumbing (DNS,
# Dapr, Postgres, monitoring/gateway namespaces) lives under the umbrella
# `global.networkPolicies` block.
networkPolicy:
  enabled: null
  # Allow Prometheus to scrape /metrics (shares the app port).
  prometheusScrape: true
  # Optional pod selector inside the monitoring namespace (empty = any pod).
  prometheusPodSelector: {}
  # North-south ingress from the Envoy Gateway data plane.
  ingressFromGateway: false
  # Every service submits audit events here.
  ingressFromServices:
    - api-gateway
    - auth-service
    - workflow-service
    - trigger-service
    - connector-service
    - catalog-service
    - activity-runtime-manager
  # Audit sink is terminal for east-west; it reaches Loki/Prometheus/SPL
  # (cluster infra), not other Custos services.
  egressToServices: []
  # Allow egress to the CNPG Postgres cluster.
  egressToPostgres: true

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: custos-secret-store
    kind: ClusterSecretStore
  data: []
