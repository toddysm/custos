# workflow-service — leave image.repository/tag/pullPolicy and replicaCount/resources
# empty to inherit umbrella global.* values. Set them here only to override
# the umbrella for this one subchart.
#
# Configuration variables come from
# design/components/workflow-service/design.md § Configuration. Non-secret
# vars are projected through the ConfigMap (`config:` block below). The
# Workflow Service has no secret env vars in v1 — service-to-service
# authentication is delegated to Dapr / SPIFFE — so the ExternalSecret
# block is kept as a disabled stub for forward compatibility.

enabled: true

replicaCount: ""

image:
  # Leave repository empty so templates/_helpers.tpl `svc.image` composes
  # `<global.imageRegistry>/<chart name>`. This keeps airgapped profiles
  # honouring `global.imageRegistry: registry.internal/custos` and falls
  # back to the umbrella GHCR default in connected profiles. Override
  # only when a profile genuinely needs a different per-subchart repo.
  repository: ""
  tag: ""
  pullPolicy: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

# Per-pod env overrides. Most config flows through envFrom (ConfigMap +
# optional ExternalSecret); this list is for ad-hoc overrides only.
env: []

dapr:
  enabled: true
  appPort: 8080
  appProtocol: http
  logLevel: info

# Startup probe. The FastAPI lifespan blocks on the Dapr Workflow worker
# reporting ready before uvicorn starts serving HTTP, so on a cold cluster the
# liveness/readiness probes would otherwise hit a connection-refused window and
# crash-loop the pod before the worker converges (issue #816). The startupProbe
# gates liveness/readiness until the process is serving and gives the
# worker-ready wait (plus Dapr sidecar/placement cold start) a generous budget:
# periodSeconds * failureThreshold seconds.
startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 30
  timeoutSeconds: 3

serviceMonitor:
  enabled: false

# HA-gated autoscaling (DEPLOY-IMPL-010). HPA renders only when this resolves
# on: `enabled: null` inherits the umbrella HA profile
# (`global.profile == "ha"`); set true/false to override this one service.
# When the HPA is active the Deployment drops its static `replicas` so the
# autoscaler owns the count.
autoscaling:
  enabled: null
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# HA-gated PodDisruptionBudget (DEPLOY-IMPL-010). Same inheritance rule as
# autoscaling. Keeps at least N-1 pods available during voluntary disruptions.
podDisruptionBudget:
  enabled: null
  maxUnavailable: 1

# NetworkPolicy (DEPLOY-IMPL-009) — this service's slice of the design
# Networking allow matrix. Pairs with the umbrella deny-all.
# `enabled: null` inherits the umbrella `global.networkPolicies.enabled`;
# set true/false here to override this one service. Shared plumbing (DNS,
# Dapr, Postgres, monitoring/gateway namespaces) lives under the umbrella
# `global.networkPolicies` block.
networkPolicy:
  enabled: null
  # Allow Prometheus to scrape /metrics (shares the app port).
  prometheusScrape: true
  # Optional pod selector inside the monitoring namespace (empty = any pod).
  prometheusPodSelector: {}
  # North-south ingress from the Envoy Gateway data plane.
  ingressFromGateway: false
  # Workflow runs are started by the gateway and by trigger fan-out.
  ingressFromServices:
    - api-gateway
    - trigger-service
  # Workflow orchestrates connectors, activities, catalog, auth and audit.
  egressToServices:
    - connector-service
    - activity-runtime-manager
    - catalog-service
    - auth-service
    - observability-audit-service
  # Allow egress to the CNPG Postgres cluster.
  egressToPostgres: true

# Non-secret WF_* env vars projected into the ConfigMap.
#
# Required-but-unset values (the four endpoint URLs and the Dapr Workflow
# component name) carry sane in-cluster defaults matching the Service names
# emitted by the sibling subcharts. Override per-profile when those services
# are reached through a different address.
config:
  # design.md § Configuration — Dapr Workflow component binding.
  daprWorkflowComponent: workflow-dapr
  publishTopic: custos.workflow.events
  # Run-state retention + idempotency windows (ISO-8601 durations or the
  # day-suffix format documented in the design table).
  runHistoryRetention: 90d
  resumeSubDefaultTtl: PT24H
  registerSubMaxRetries: 5
  exprTimeoutMs: 100
  idempotencyKeyTtl: PT24H

# Sibling-service endpoints. Defaults match the in-cluster Service names
# emitted by the corresponding subcharts; override per-profile when those
# services are reached through a different address (e.g. via a sidecar / out-
# of-cluster proxy).
arm:
  endpoint: http://activity-runtime-manager:8080
trigger:
  endpoint: http://trigger-service:8080
connector:
  endpoint: http://connector-service:8080
catalog:
  endpoint: http://catalog-service:8080

# ExternalSecret stub. The Workflow Service has no secret env vars in v1,
# so this block stays disabled by default. Profiles that need to inject
# secret-store-backed env vars (e.g. a future privileged signing key for
# inter-component auth) flip `enabled: true` and append their entries to
# `data:`.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: custos-secret-store
    kind: ClusterSecretStore
  data: []
