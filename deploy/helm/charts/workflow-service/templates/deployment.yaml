apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- if ne (include "svc.autoscalingEnabled" .) "true" }}
  # Static replica count. Omitted when the HPA is active so it owns the count.
  replicas: {{ include "svc.replicaCount" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "svc.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "svc.daprAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "svc.fullname" . }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "svc.image" . | quote }}
          imagePullPolicy: {{ include "svc.imagePullPolicy" . }}
          # WF-IMPL-015 wires the FastAPI surface through
          # ``python -m custos_workflow`` which launches uvicorn against
          # ``custos_workflow:create_app`` honouring HOST / PORT env vars.
          command: ["python", "-m", "custos_workflow"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "svc.fullname" . }}
            {{- if .Values.externalSecret.enabled }}
            # ExternalSecret materializes a Secret under the same name carrying
            # any secret-store-backed env vars (none in v1 — this branch is a
            # forward-compatible stub). Order matters: ConfigMap first so env
            # vars common to all profiles are set; Secret last so the
            # secret-store-backed entries win on overlap.
            - secretRef:
                name: {{ include "svc.fullname" . }}
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "svc.resources" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
