# api-gateway — defaults are overridden via the umbrella chart's global values when rendered together.

replicaCount: 1

image:
  repository: ghcr.io/toddysm/custos/api-gateway
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []

dapr:
  enabled: true
  appPort: 8080
  appProtocol: http
  logLevel: info

serviceMonitor:
  enabled: false

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: custos-secret-store
    kind: ClusterSecretStore
  data: []
