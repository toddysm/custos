apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- if ne (include "svc.autoscalingEnabled" .) "true" }}
  # Static replica count. Omitted when the HPA is active so it owns the count.
  replicas: {{ include "svc.replicaCount" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "svc.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "svc.daprAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "svc.fullname" . }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "svc.image" . | quote }}
          imagePullPolicy: {{ include "svc.imagePullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "svc.fullname" . }}
            {{- if .Values.externalSecret.enabled }}
            # ExternalSecret materializes a Secret under the same name. Order
            # matters: ConfigMap first so the common CUSTOS_GATEWAY_* env is set;
            # Secret last so any secret-store-backed override wins on overlap.
            - secretRef:
                name: {{ include "svc.fullname" . }}
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "svc.resources" . | nindent 12 }}
          {{- if .Values.startupProbe.enabled }}
          # The flat `/healthz` startupProbe covers the cold-start window until
          # uvicorn is serving HTTP so the livenessProbe does not restart a
          # slow-starting pod. Readiness convergence (the background startup
          # permission cross-check, issue #815) is surfaced via `/readyz` and is
          # not bounded by this probe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
