{{- /*
Standardized per-service NetworkPolicy (DEPLOY-IMPL-009).

Implements one half of the design's Networking allow matrix
(reference-deployment.md, resolves TODO-004): the umbrella ships a
default deny-all (templates/networkpolicy-deny-all.yaml) and every
service subchart ships this allow policy so that, when the platform
operator flips `global.networkPolicies.enabled` on, only the
documented east-west / north-south / scrape / DB / DNS / Dapr flows
are permitted.

Enable resolution: the per-service `networkPolicy.enabled` overrides
the umbrella `global.networkPolicies.enabled` when explicitly set
(true/false); when left null it inherits the global toggle. This lets
the umbrella turn every policy on at once while still allowing a
single service to opt out.

`/metrics` shares the app port (service.port); the Prometheus rule and
the service-to-service rules therefore all target service.port. Dapr
service invocation is sidecar-to-sidecar, so the east-west rules also
allow the Dapr sidecar ports.
*/ -}}
{{- $np := .Values.networkPolicy | default dict -}}
{{- $g := (.Values.global | default dict).networkPolicies | default dict -}}
{{- $enabled := $g.enabled | default false -}}
{{- if not (kindIs "invalid" $np.enabled) -}}{{- $enabled = $np.enabled -}}{{- end -}}
{{- if $enabled -}}
{{- $appPort := .Values.service.port -}}
{{- $daprPorts := $g.daprPorts | default (list 3500 50001 50002) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if $np.prometheusScrape }}
    # Prometheus scrape of the in-pod /metrics (shares the app port).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.monitoringNamespace | default "monitoring" }}
          {{- with $np.prometheusPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $appPort }}
    {{- end }}
    {{- if $np.ingressFromGateway }}
    # North-south ingress from the Envoy Gateway data plane.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.gatewayNamespace | default "custos-system" }}
      ports:
        - protocol: TCP
          port: {{ $appPort }}
        {{- range $p := $daprPorts }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    {{- end }}
    {{- with $np.ingressFromServices }}
    # East-west ingress from the Custos services that call this one
    # (direct on the app port + the Dapr sidecar ports for invocation).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range . }}
                  - {{ . }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: {{ $appPort }}
        {{- range $p := $daprPorts }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    {{- end }}
  egress:
    # DNS resolution — always required.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.dnsNamespace | default "kube-system" }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Dapr control plane (Sentry / Placement / Operator / Injector).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.daprNamespace | default "dapr-system" }}
    {{- if $np.egressToPostgres }}
    # CNPG Postgres cluster.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml ($g.postgresPodSelector | default (dict "cnpg.io/cluster" "custos")) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $g.postgresPort | default 5432 }}
    {{- end }}
    {{- with $np.egressToServices }}
    # East-west egress to the Custos services this one calls.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range . }}
                  - {{ . }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: {{ $appPort }}
        {{- range $p := $daprPorts }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    {{- end }}
{{- end }}
