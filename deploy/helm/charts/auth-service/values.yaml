# auth-service — leave image.repository/tag/pullPolicy and replicaCount/resources
# empty to inherit umbrella global.* values. Set them here only to override
# the umbrella for this one subchart.
#
# Configuration variables come from
# design/components/auth-service/design.md § Configuration. Non-secret
# vars are projected through the ConfigMap (`config:` block below). The
# call-context signing key itself is resolved by the service at runtime
# via the Dapr Secrets API using the *reference* in
# `CUSTOS_AUTH_CALL_CONTEXT_KEY_REF` — it is NOT a Kubernetes Secret.
# The two SPL Postgres DSNs (`CUSTOS_AUTH_STORE_DSN`,
# `CUSTOS_AUTH_METADATA_STORE_DSN`) introduced by AS-IMPL-004 flow
# through `externalSecret:` below.

enabled: true

replicaCount: ""

image:
  # Default repository is built from <global.imageRegistry>/<chart name>
  # by templates/_helpers.tpl `svc.image`. Leave `image.repository` empty
  # here so airgapped/override profiles can switch registries via
  # `global.imageRegistry`; document the binding in comments rather than
  # hardcoding the repository.
  repository: ""
  tag: ""
  pullPolicy: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

# Per-pod env overrides. Most config flows through envFrom (ConfigMap +
# ExternalSecret); this list is for ad-hoc overrides only.
env: []

dapr:
  enabled: true
  appPort: 8080
  appProtocol: http
  logLevel: info

serviceMonitor:
  enabled: false

# Non-secret CUSTOS_AUTH_* env vars projected into the ConfigMap.
#
# Required-at-install values (`oidcIssuers`, `callContextKeyRef`,
# `platformAdminBootstrap`) are left empty by default so `helm template`
# stays green on the scaffold; the umbrella per-profile values files OR
# a pre-install operator workflow MUST set them before the service can
# pass AS-IMPL-018 (JWKS rotation) and AS-IMPL-020 (OIDC verifier)
# bring-up.
config:
  # design.md § Configuration defaults
  serviceTokenTtlDefault: "90d"
  callContextKeyRotation: "7d"
  internalIdentityMode: "jwt"
  authzCacheTtl: "60s"
  authnCacheTtl: "30s"
  # Required at install / first boot. Override per-profile.
  oidcIssuers: ""
  callContextKeyRef: ""
  platformAdminBootstrap: ""

# ExternalSecret carrying the two Postgres DSNs the service reads at
# startup (CUSTOS_AUTH_STORE_DSN, CUSTOS_AUTH_METADATA_STORE_DSN).
# Disabled by default (eval profiles can synthesise the DSNs from the
# CNPG app secret); HA / connected profiles enable this and project the
# keys from the configured secret store path.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: custos-secret-store
    kind: ClusterSecretStore
  # Each entry maps a CUSTOS_AUTH_* env var (secretKey) to a key in the
  # upstream secret store. Defaults expect the SPL-conventional path
  # `custos/storage-provider-layer/<tier>` populated by ops; override
  # per deployment as needed.
  data:
    - secretKey: CUSTOS_AUTH_STORE_DSN
      remoteRef:
        key: custos/storage-provider-layer/auth-store
        property: dsn
    - secretKey: CUSTOS_AUTH_METADATA_STORE_DSN
      remoteRef:
        key: custos/storage-provider-layer/metadata-store
        property: dsn
