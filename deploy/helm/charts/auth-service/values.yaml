# auth-service — leave image.repository/tag/pullPolicy and replicaCount/resources
# empty to inherit umbrella global.* values. Set them here only to override
# the umbrella for this one subchart.
#
# Configuration variables come from
# design/components/auth-service/design.md § Configuration. Non-secret
# vars are projected through the ConfigMap (`config:` block below). The
# call-context signing key itself is resolved by the service at runtime
# via the Dapr Secrets API using the *reference* in
# `CUSTOS_AUTH_CALL_CONTEXT_KEY_REF` — it is NOT a Kubernetes Secret.
# The two SPL Postgres DSNs (`CUSTOS_AUTH_STORE_DSN`,
# `CUSTOS_AUTH_METADATA_STORE_DSN`) introduced by AS-IMPL-004 flow
# through `externalSecret:` below.

enabled: true

replicaCount: ""

image:
  # Default repository is built from <global.imageRegistry>/<chart name>
  # by templates/_helpers.tpl `svc.image`. Leave `image.repository` empty
  # here so airgapped/override profiles can switch registries via
  # `global.imageRegistry`; document the binding in comments rather than
  # hardcoding the repository.
  repository: ""
  tag: ""
  pullPolicy: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

# Per-pod env overrides. Most config flows through envFrom (ConfigMap +
# ExternalSecret); this list is for ad-hoc overrides only.
env: []

dapr:
  enabled: true
  appPort: 8080
  appProtocol: http
  logLevel: info

serviceMonitor:
  enabled: false

# HA-gated autoscaling (DEPLOY-IMPL-010). HPA renders only when this resolves
# on: `enabled: null` inherits the umbrella HA profile
# (`global.profile == "ha"`); set true/false to override this one service.
# When the HPA is active the Deployment drops its static `replicas` so the
# autoscaler owns the count.
autoscaling:
  enabled: null
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# HA-gated PodDisruptionBudget (DEPLOY-IMPL-010). Same inheritance rule as
# autoscaling. Keeps at least N-1 pods available during voluntary disruptions.
podDisruptionBudget:
  enabled: null
  maxUnavailable: 1

# NetworkPolicy (DEPLOY-IMPL-009) — this service's slice of the design
# Networking allow matrix. Pairs with the umbrella deny-all.
# `enabled: null` inherits the umbrella `global.networkPolicies.enabled`;
# set true/false here to override this one service. Shared plumbing (DNS,
# Dapr, Postgres, monitoring/gateway namespaces) lives under the umbrella
# `global.networkPolicies` block.
networkPolicy:
  enabled: null
  # Allow Prometheus to scrape /metrics (shares the app port).
  prometheusScrape: true
  # Optional pod selector inside the monitoring namespace (empty = any pod).
  prometheusPodSelector: {}
  # North-south ingress from the Envoy Gateway data plane.
  ingressFromGateway: false
  # Every service authenticates/authorizes through auth-service.
  ingressFromServices:
    - api-gateway
    - workflow-service
    - trigger-service
    - connector-service
    - catalog-service
    - activity-runtime-manager
  # auth-service emits audit events.
  egressToServices:
    - observability-audit-service
  # Allow egress to the CNPG Postgres cluster.
  egressToPostgres: true

# Non-secret CUSTOS_AUTH_* env vars projected into the ConfigMap.
#
# Required-at-install values (`oidcIssuers`, `callContextKeyRef`,
# `platformAdminBootstrap`) are left empty by default so `helm template`
# stays green on the scaffold; the umbrella per-profile values files OR
# a pre-install operator workflow MUST set them before the service can
# pass AS-IMPL-018 (JWKS rotation) and AS-IMPL-020 (OIDC verifier)
# bring-up.
config:
  # design.md § Configuration defaults
  serviceTokenTtlDefault: "90d"
  # Integer seconds. ``0`` disables the in-process rotation loop
  # (operator manages rotation externally). The default matches the
  # design's 7-day rotation cadence (AS-IMPL-018).
  callContextKeyRotation: "604800"
  # Integer seconds. Lifetime of every minted internal call-context
  # JWT. 300 (5 minutes) matches the design (AS-IMPL-017).
  callContextTtlSeconds: "300"
  # Dapr secret-store *component name* the service queries when
  # ``callContextKeyRef`` is set. Match the component installed via
  # the Dapr subchart.
  callContextSecretStore: "custos-secrets"
  # JWT ``aud`` claim stamped on every call-context token. Verifiers
  # in other Custos components must be configured with the same
  # value (AS-IMPL-019).
  callContextAudience: "custos.internal"
  internalIdentityMode: "jwt"
  authzCacheTtl: "60s"
  authnCacheTtl: "30s"
  # OIDC end-user login (POST /v1/auth/login/oidc/callback). AS-IMPL-024
  # feature flag gating the handler shipped in AS-IMPL-020..023. With
  # this flag off the callback returns 503 ``oidc_not_enabled``; with
  # it on AND ``oidcIssuers`` carrying at least one entry, the route
  # verifies provider id-tokens against the configured JWKS, applies
  # the GitHub / Entra preset defaults, and zero-binding-provisions
  # the principal on first contact.
  oidcEnabled: "false"
  # JSON document (single-line, projected through the ConfigMap) of the
  # form ``{"issuers": [...]}`` with one block per configured issuer.
  # Each block requires ``id``, ``issuer_url``, ``jwks_uri``,
  # ``audiences``; presets ``github`` / ``entra`` supply remaining
  # defaults. Use ``client_secret_env`` (NOT ``client_secret``) so the
  # secret is injected via the externalSecret / Dapr secret store and
  # never written to this values file. Example (uncomment + adapt):
  #
  #   oidcIssuers: |
  #     {"issuers":[
  #       {"id":"github","preset":"github","audiences":["api://custos"],
  #        "token_endpoint":"https://github.com/login/oauth/access_token",
  #        "client_id":"Iv1.example","client_secret_env":"CUSTOS_AUTH_OIDC_GITHUB_SECRET"},
  #       {"id":"entra","preset":"entra",
  #        "issuer_url":"https://login.microsoftonline.com/{tenant}/v2.0",
  #        "jwks_uri":"https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys",
  #        "audiences":["api://custos"],
  #        "token_endpoint":"https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token",
  #        "client_id":"00000000-0000-0000-0000-000000000000",
  #        "client_secret_env":"CUSTOS_AUTH_OIDC_ENTRA_SECRET"}
  #     ]}
  oidcIssuers: ""
  callContextKeyRef: ""
  platformAdminBootstrap: ""

# ExternalSecret carrying the two Postgres DSNs the service reads at
# startup (CUSTOS_AUTH_STORE_DSN, CUSTOS_AUTH_METADATA_STORE_DSN).
# Disabled by default (eval profiles can synthesise the DSNs from the
# CNPG app secret); HA / connected profiles enable this and project the
# keys from the configured secret store path.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: custos-secret-store
    kind: ClusterSecretStore
  # Each entry maps a CUSTOS_AUTH_* env var (secretKey) to a key in the
  # upstream secret store. Defaults expect the SPL-conventional path
  # `custos/storage-provider-layer/<tier>` populated by ops; override
  # per deployment as needed.
  data:
    - secretKey: CUSTOS_AUTH_STORE_DSN
      remoteRef:
        key: custos/storage-provider-layer/auth-store
        property: dsn
    - secretKey: CUSTOS_AUTH_METADATA_STORE_DSN
      remoteRef:
        key: custos/storage-provider-layer/metadata-store
        property: dsn
