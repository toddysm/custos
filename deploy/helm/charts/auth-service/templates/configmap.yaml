apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
data:
  CUSTOS_SERVICE_NAME: {{ .Chart.Name | quote }}
  # Non-secret CUSTOS_AUTH_* env vars per design.md § Configuration.
  CUSTOS_AUTH_SERVICE_TOKEN_TTL_DEFAULT: {{ .Values.config.serviceTokenTtlDefault | quote }}
  CUSTOS_AUTH_CALL_CONTEXT_KEY_ROTATION: {{ .Values.config.callContextKeyRotation | quote }}
  CUSTOS_AUTH_CALL_CONTEXT_TTL_SECONDS: {{ .Values.config.callContextTtlSeconds | quote }}
  CUSTOS_AUTH_CALL_CONTEXT_SECRET_STORE: {{ .Values.config.callContextSecretStore | quote }}
  CUSTOS_AUTH_CALL_CONTEXT_AUDIENCE: {{ .Values.config.callContextAudience | quote }}
  CUSTOS_AUTH_INTERNAL_IDENTITY_MODE: {{ .Values.config.internalIdentityMode | quote }}
  CUSTOS_AUTH_AUTHZ_CACHE_TTL: {{ .Values.config.authzCacheTtl | quote }}
  CUSTOS_AUTH_AUTHN_CACHE_TTL: {{ .Values.config.authnCacheTtl | quote }}
  # AS-IMPL-024 feature flag gating the OIDC callback handler shipped
  # in AS-IMPL-020..023. With this off the callback returns 503
  # ``oidc_not_enabled``; with it on AND ``oidcIssuers`` populated the
  # route verifies provider id-tokens and zero-binding-provisions the
  # caller's principal on first contact.
  CUSTOS_AUTH_OIDC_ENABLED: {{ .Values.config.oidcEnabled | quote }}
  # CUSTOS_AUTH_CALL_CONTEXT_KEY_REF is a Dapr secret-store *reference*
  # (the name of the entry the service looks up at runtime via the Dapr
  # Secrets API), not the signing key itself. It is safe to project
  # through the ConfigMap.
  {{- with .Values.config.callContextKeyRef }}
  CUSTOS_AUTH_CALL_CONTEXT_KEY_REF: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.oidcIssuers }}
  CUSTOS_AUTH_OIDC_ISSUERS: {{ . | quote }}
  {{- end }}
  # Colon-separated permission-registry files the service aggregates at
  # startup (#867). Each component ships its own permissions.yaml baked
  # into the auth-service image; the union must cover every permission
  # the API Gateway route table requires. Empty ⇒ bundled aggregate.
  {{- with .Values.config.permissionsPaths }}
  CUSTOS_AUTH_PERMISSIONS_PATHS: {{ . | quote }}
  {{- end }}
