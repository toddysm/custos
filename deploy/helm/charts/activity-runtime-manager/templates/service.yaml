apiVersion: v1
kind: Service
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- $receiver := ((.Values.global | default dict).receiverRuntime) | default dict }}
    - name: {{ ternary "https" "http" ($receiver.enabled | default false) }}
      port: {{ .Values.service.port }}
      targetPort: {{ ternary "https" "http" ($receiver.enabled | default false) }}
    {{- if $receiver.enabled }}
    - name: metrics
      port: 8090
      targetPort: metrics
    {{- end }}
  selector:
    {{- include "svc.selectorLabels" . | nindent 4 }}
