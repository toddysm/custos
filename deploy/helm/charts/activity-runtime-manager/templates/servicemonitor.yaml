{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ ternary "metrics" "http" ((((.Values.global | default dict).receiverRuntime) | default dict).enabled | default false) }}
      path: /metrics
{{- end }}
