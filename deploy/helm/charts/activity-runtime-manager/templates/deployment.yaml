{{- $receiver := ((.Values.global | default dict).receiverRuntime) | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- if ne (include "svc.autoscalingEnabled" .) "true" }}
  # Static replica count. Omitted when the HPA is active so it owns the count.
  replicas: {{ include "svc.replicaCount" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "svc.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if $receiver.enabled }}
        dapr.io/enabled: "true"
        dapr.io/app-id: "activity-runtime-manager"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "https"
        {{- include "custos.receiverAnnotations" . | nindent 8 }}
        {{- else }}
        {{- include "svc.daprAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "svc.fullname" . }}
      {{- if $receiver.enabled }}
      terminationGracePeriodSeconds: {{ $receiver.terminationGraceSeconds }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: runtime-tls
          secret:
            secretName: {{ $receiver.tlsSecret | quote }}
            defaultMode: 0440
        - name: runtime-staging
          emptyDir: {}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ $receiver.artifactClaim | quote }}
      {{- end }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "svc.image" . | quote }}
          imagePullPolicy: {{ include "svc.imagePullPolicy" . }}
          {{- if $receiver.enabled }}
          command: ["uvicorn"]
          args:
            - custos_arm:create_app
            - --factory
            - --timeout-graceful-shutdown
            - "15"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ssl-certfile
            - /custos/tls/tls.crt
            - --ssl-keyfile
            - /custos/tls/tls.key
          volumeMounts:
            - name: runtime-tls
              mountPath: /custos/tls
              readOnly: true
            - name: runtime-staging
              mountPath: /var/run/custos
            - name: artifacts
              mountPath: /custos/artifacts
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "svc.fullname" . }}
          {{- if $receiver.enabled }}
          env:
            {{- include "custos.receiverEnv" . | nindent 12 }}
          {{- else }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- include "svc.resources" . | nindent 12 }}
          {{- if $receiver.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 3
            failureThreshold: 60
            timeoutSeconds: 3
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $receiver.enabled }}
              scheme: HTTPS
              {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if $receiver.enabled }}
              scheme: HTTPS
              {{- end }}
