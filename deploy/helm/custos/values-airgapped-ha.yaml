# Profile: airgapped + HA
# 3 replicas, CNPG 3-node, MinIO 4-node, Sealed Secrets, in-cluster Keycloak.

topology: airgapped
profile: ha

global:
  imageRegistry: registry.internal/custos
  imageTag: dev
  profile: ha
  replicaCount: 3
  # The Bitnami subcharts (Redis / Keycloak) refuse mirrored images unless this
  # is set, since the air-gapped registry is not the upstream Bitnami one.
  security:
    allowInsecureImages: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Mirror the Dapr control-plane images alongside the Custos images and run the
# control plane in HA to match the platform's HA topology.
dapr:
  global:
    registry: registry.internal/dapr
    ha:
      enabled: true

# Mirror the cert-manager images (Envoy Gateway uses the umbrella global registry).
cert-manager:
  imageRegistry: registry.internal

# Mirror the observability subchart images. Loki and the OTel Collector honour
# the umbrella `global.imageRegistry` (registry.internal/custos), so they are
# redirected automatically. Prometheus pins full image paths (no global knob),
# so repoint it at the mirror explicitly.
prometheus:
  server:
    image:
      repository: registry.internal/prometheus/prometheus
  configmapReload:
    prometheus:
      image:
        repository: registry.internal/prometheus-operator/prometheus-config-reloader

# Sealed Secrets pins its own `image.registry` and ignores the umbrella
# `global.imageRegistry`, so repoint it at the mirror explicitly (the controller
# only renders because `secrets.sealed.enabled` is true below). Keycloak honours
# the umbrella global registry, so it is mirrored automatically.
sealed-secrets:
  image:
    registry: registry.internal/custos

postgres:
  embedded: true
  instances: 3
  storageSize: 100Gi

objectStorage:
  embedded: true
  nodes: 4
  driveSize: 200Gi

# HA pub/sub broker: run Redis with a primary + replicas instead of the eval
# standalone. The Dapr pub/sub component still targets the `custos-redis-master`
# Service, so no component rewiring is needed. Images mirror via the umbrella
# `global.imageRegistry`.
redis:
  architecture: replication
  replica:
    replicaCount: 2

# HA log storage: move Loki off the eval filesystem onto the MinIO
# `custos-loki` bucket (design: object-storage chunks). The MinIO credentials
# are injected as env vars from the `custos-minio` Secret and expanded into the
# Loki config via `-config.expand-env=true`, so no plaintext keys land in the
# ConfigMap. Loki images are mirrored via the umbrella `global.imageRegistry`.
loki:
  loki:
    storage:
      type: s3
      bucketNames:
        chunks: custos-loki
        ruler: custos-loki
        admin: custos-loki
      s3:
        endpoint: minio:9000
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: custos-minio
            key: accessKey
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: custos-minio
            key: secretKey

secrets:
  backend: sealed
  eso:
    enabled: false
  sealed:
    enabled: true

oidc:
  mode: keycloak
  issuer: http://keycloak.custos-system.svc.cluster.local/realms/custos
  clientId: custos
  keycloak:
    enabled: true

gateway:
  hostname: custos.internal

# Airgapped HA still wires CAT_DEFINITION_STORE / CAT_CATALOG_STORE through
# ExternalSecret; the secret-store backend swaps to Sealed Secrets via the
# umbrella `secrets:` block.
catalog-service:
  externalSecret:
    enabled: true

# Airgapped HA still wires CONN_CATALOG_STORE / CONN_METADATA_STORE through
# ExternalSecret; the secret-store backend swaps to Sealed Secrets via the
# umbrella `secrets:` block.
connector-service:
  externalSecret:
    enabled: true
