{{- if .Values.dapr.install -}}
{{- $components := .Values.dapr.components -}}
{{/*
RBAC for the Dapr secret store.

Every daprd sidecar loads ALL Dapr Components at startup, and each
credential-bearing Component resolves its `secretKeyRef`s through the secret
store using the sidecar's identity — the pod ServiceAccount. When that store is
Kubernetes-backed (the eval default `secretstores.kubernetes`, or the runtime's
built-in `kubernetes` fallback when no secretStore Component is configured),
every service ServiceAccount therefore needs `get` on the referenced Secrets.
Without it daprd fails component init with `secrets "<name>" is forbidden` and
the sidecar CrashLoopBackOffs, taking the whole control plane down.

HA installs that point the secret store at an external backend (e.g. Vault) read
those Secrets out-of-cluster, so this Kubernetes RBAC is not rendered for them.
*/}}
{{- $secretStoreIsK8s := true -}}
{{- if $components.secretStore.enabled -}}
{{- $secretStoreIsK8s = eq $components.secretStore.type "secretstores.kubernetes" -}}
{{- end -}}
{{- if $secretStoreIsK8s -}}
{{- $secretNames := list -}}
{{- if $components.stateStore.enabled -}}
{{- $secretNames = append $secretNames (default .Values.postgres.secretName $components.stateStore.connectionSecret) -}}
{{- end -}}
{{- if $components.pubsub.redis.enabled -}}
{{- $secretNames = append $secretNames $components.pubsub.redis.passwordSecret -}}
{{- end -}}
{{- if $components.pubsub.postgres.enabled -}}
{{- $secretNames = append $secretNames (default .Values.postgres.secretName $components.pubsub.postgres.connectionSecret) -}}
{{- end -}}
{{- $secretNames = $secretNames | uniq | sortAlpha -}}
{{- $services := list "api-gateway" "auth-service" "workflow-service" "trigger-service" "connector-service" "activity-runtime-manager" "catalog-service" "observability-audit-service" -}}
{{- if gt (len $secretNames) 0 }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dapr-secret-reader
  namespace: {{ include "custos.namespace" . }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
rules:
  # Scoped to exactly the Secrets the Dapr Components reference — least
  # privilege: the sidecars can read these credentials and nothing else.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $secretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dapr-secret-reader
  namespace: {{ include "custos.namespace" . }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-dapr-secret-reader
subjects:
  {{- range $svc := $services }}
  {{- if (index $.Values $svc).enabled }}
  - kind: ServiceAccount
    name: {{ printf "%s-%s" $.Release.Name $svc }}
    namespace: {{ include "custos.namespace" $ }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
