{{- if .Values.namespace.create -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | default .Release.Namespace }}
  {{- if and .Values.global.receiverRuntime.enabled .Values.global.receiverRuntime.retainLegacyExecutionResources }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
{{- end }}
