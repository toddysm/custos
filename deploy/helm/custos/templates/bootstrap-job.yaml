{{- if .Values.bootstrap.enabled -}}
{{- $adminToken := .Values.bootstrap.adminToken -}}
{{- if not (has $adminToken.mode (list "disabled" "init" "recover")) -}}
{{- fail "bootstrap.adminToken.mode must be one of: disabled, init, recover" -}}
{{- end -}}
{{- if or (lt (int $adminToken.ttlSeconds) 1) (gt (int $adminToken.ttlSeconds) 31536000) -}}
{{- fail "bootstrap.adminToken.ttlSeconds must be between 1 and 31536000" -}}
{{- end -}}
{{- if ne $adminToken.mode "disabled" -}}
{{- required "bootstrap.adminToken.secretName is required for init/recover" $adminToken.secretName -}}
{{- required "bootstrap.adminToken.secretKey is required for init/recover" $adminToken.secretKey -}}
{{- required "bootstrap.adminToken.principalId is required for init/recover" $adminToken.principalId -}}
{{- required "bootstrap.adminToken.workspaceId is required for init/recover" $adminToken.workspaceId -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: custos-bootstrap
  namespace: {{ include "custos.namespace" . }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "custos.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: custos-bootstrap
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Postgres connection details are read from the secret the CNPG
          # operator generates for the application user (default name
          # `<cluster>-app`; configurable via postgres.secretName). The
          # secret exposes username/password/host/port/dbname/uri keys; the
          # bootstrap entrypoint resolves CUSTOS_PG_DSN from `uri`.
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName | quote }}
          # The initial platform admin is pre-bound by their OIDC identity so
          # they can authenticate immediately after install. Both values are
          # optional: when absent the seeder still seeds
          # permissions/roles/tenant/workspace and an operator can bind an
          # admin later.
          env:
            {{- with .Values.bootstrap.permissionsPaths }}
            # Per-component permissions.yaml files the seeder aggregates at
            # startup (#867 / AS-IMPL-032), mirroring the auth-service chart so
            # the post-install seed and the auth-service pod load the identical
            # registry surface. Empty ⇒ bundled aggregate fallback.
            - name: CUSTOS_AUTH_PERMISSIONS_PATHS
              value: {{ . | quote }}
            {{- end }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.adminOidcRef.name | quote }}
                  key: {{ .Values.bootstrap.adminOidcRef.issuerKey | quote }}
                  optional: true
            - name: CUSTOS_BOOTSTRAP_ADMIN_OIDC_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.adminOidcRef.name | quote }}
                  key: {{ .Values.bootstrap.adminOidcRef.subjectKey | quote }}
                  optional: true
            {{- if ne $adminToken.mode "disabled" }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_TOKEN_MODE
              value: {{ $adminToken.mode | quote }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $adminToken.secretName | quote }}
                  key: {{ $adminToken.secretKey | quote }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_PRINCIPAL_ID
              value: {{ $adminToken.principalId | quote }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_WORKSPACE_ID
              value: {{ $adminToken.workspaceId | quote }}
            - name: CUSTOS_BOOTSTRAP_ADMIN_TOKEN_TTL_SECONDS
              value: {{ printf "%d" (int $adminToken.ttlSeconds) | quote }}
            {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custos-bootstrap
  namespace: {{ include "custos.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
{{- end }}
