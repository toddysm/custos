{{- $tls := .Values.gateway.tls.certManager -}}
{{- if $tls.enabled -}}
# cert-manager Certificate that materializes the Gateway's TLS Secret
# (gateway.tlsSecretName). The Gateway HTTPS listener references that Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tlsSecretName | quote }}
  namespace: {{ include "custos.namespace" . }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.tlsSecretName | quote }}
  dnsNames:
    - {{ .Values.gateway.hostname | quote }}
  issuerRef:
    name: {{ $tls.issuerRef.name | quote }}
    kind: {{ $tls.issuerRef.kind }}
    group: cert-manager.io
{{- end }}
