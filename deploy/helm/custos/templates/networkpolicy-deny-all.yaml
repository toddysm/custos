{{- if (.Values.global.networkPolicies | default dict).enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: {{ include "custos.namespace" . }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
