{{- if .Values.dapr.install -}}
{{- $ns := include "custos.namespace" . -}}
{{- $components := .Values.dapr.components -}}
{{/*
Credential-bearing Components resolve their `secretKeyRef`s through the Dapr
secret store. When the secret-store Component is enabled, route through it (so
HA installs that move secrets to e.g. Vault take effect); otherwise fall back to
the runtime's built-in `kubernetes` store.
*/}}
{{- $secretStore := "kubernetes" -}}
{{- if $components.secretStore.enabled -}}{{- $secretStore = $components.secretStore.name -}}{{- end -}}
{{- with $components.stateStore }}
{{- if .enabled }}
# State store backed by the CNPG Postgres cluster. The connection URI is pulled
# from the CNPG application secret through the configured Dapr secret store so
# the credential never appears in the rendered manifest.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: {{ .connectionSecret | default $.Values.postgres.secretName | quote }}
        key: {{ .connectionKey | quote }}
    {{- if .actorStateStore }}
    # Dapr Workflow is built on the actor model (REQ-046); the workflow engine
    # only initialises once a state store advertises itself as the actor state
    # store. Flagging the CNPG-backed store here lets the workflow-service
    # sidecar host the workflow engine so its worker reaches ready (issue #816).
    - name: actorStateStore
      value: "true"
    {{- end }}
auth:
  secretStore: {{ $secretStore | quote }}
{{- end }}
{{- end }}
{{- with $components.secretStore }}
{{- if .enabled }}
---
# Dapr secret store wired to the Layer-1 backend. Defaults to the built-in
# Kubernetes secret store; HA installs override `type`/`metadata` to target the
# same backend ESO manages.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  type: {{ .type | quote }}
  version: {{ .version | default "v1" | quote }}
  metadata:
    {{- with .metadata }}
    {{- toYaml . | nindent 4 }}
    {{- else }} []
    {{- end }}
{{- end }}
{{- end }}
{{- with $components.pubsub.redis }}
{{- if .enabled }}
---
# Redis pub/sub broker for low-latency fan-out. Services reference this
# component by name (custos-pubsub). The Redis broker itself is provisioned in
# DEPLOY-IMPL-015; the password is resolved via the configured secret store.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: {{ .host | quote }}
    - name: redisPassword
      secretKeyRef:
        name: {{ .passwordSecret | quote }}
        key: {{ .passwordKey | quote }}
auth:
  secretStore: {{ $secretStore | quote }}
{{- end }}
{{- end }}
{{- with $components.pubsub.postgres }}
{{- if .enabled }}
---
# Postgres-backed pub/sub for durable, state-aligned messaging (design D3).
# Shares the CNPG cluster credentials via the configured secret store.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  type: pubsub.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: {{ .connectionSecret | default $.Values.postgres.secretName | quote }}
        key: {{ .connectionKey | quote }}
auth:
  secretStore: {{ $secretStore | quote }}
{{- end }}
{{- end }}
{{- end }}
