{{- if .Values.dapr.install -}}
{{- $ns := include "custos.namespace" . -}}
{{- $subs := .Values.dapr.subscriptions -}}
{{- $first := true -}}
{{/* Iterate sorted keys so the rendered manifest stays stable across runs. */}}
{{- range $key := keys $subs | sortAlpha }}
{{- $sub := index $subs $key }}
{{- if $sub.enabled }}
{{- if $first }}{{ $first = false }}{{ else }}
---
{{- end }}
# Declarative pub/sub subscription scoped to the consuming Dapr app-id(s).
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: {{ $sub.name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  pubsubname: {{ $sub.pubsub | quote }}
  topic: {{ $sub.topic | quote }}
  routes:
    default: {{ $sub.route | quote }}
{{- with $sub.scopes }}
scopes:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
