{{- if .Values.dapr.install -}}
{{- $ns := include "custos.namespace" . -}}
{{- $subs := deepCopy .Values.dapr.subscriptions -}}
{{- if .Values.global.receiverRuntime.enabled -}}
{{- range $entry := list
  (dict "key" "triggerWorkflowEvents" "name" "trigger-workflow-events" "topic" "custos.workflow.events" "route" "/internal/events/workflow")
  (dict "key" "triggerConnectorEvents" "name" "trigger-connector-events" "topic" "custos.connector.events" "route" "/internal/events/connectors")
  (dict "key" "triggerNormalizedEvents" "name" "trigger-normalized-events" "topic" "custos.triggers.normalized" "route" "/internal/events/normalized") -}}
{{- $_ := set $subs $entry.key (dict "enabled" true "name" $entry.name "pubsub" "custos-pubsub"
  "topic" $entry.topic "route" $entry.route "scopes" (list "trigger-service")) -}}
{{- end -}}
{{- end -}}
{{- $first := true -}}
{{/* Iterate sorted keys so the rendered manifest stays stable across runs. */}}
{{- range $key := keys $subs | sortAlpha }}
{{- $sub := index $subs $key }}
{{- if $sub.enabled }}
{{- if $first }}{{ $first = false }}{{ else }}
---
{{- end }}
# Declarative pub/sub subscription scoped to the consuming Dapr app-id(s).
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: {{ $sub.name | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "custos.labels" $ | nindent 4 }}
spec:
  pubsubname: {{ $sub.pubsub | quote }}
  topic: {{ $sub.topic | quote }}
  routes:
    default: {{ $sub.route | quote }}
{{- with $sub.scopes }}
scopes:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
