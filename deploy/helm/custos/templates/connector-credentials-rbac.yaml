{{- if and .Values.connectorCredentials.enabled .Values.dapr.install -}}
{{- $cc := .Values.connectorCredentials -}}
{{- $releaseNs := include "custos.namespace" . -}}
{{- $ns := $cc.namespace | default $releaseNs -}}
{{- $components := .Values.dapr.components -}}
{{/*
Runtime connector-credential RBAC (CONN-DAPRSEC-02).

Connector instances source static credentials (registry usernames + PATs, etc.)
from Kubernetes Secrets read through the Dapr secret store by the
``x-dapr-secret`` identity resolver. To let operators add a NEW connector
credential to a RUNNING platform without a ``helm upgrade``, the connector
service's ServiceAccount (whose daprd sidecar performs the Secrets API read) is
granted ``get`` on Secrets in a dedicated credential namespace WITHOUT
``resourceNames`` — so any Secret created later in that namespace is immediately
readable. The namespace holds ONLY connector credentials, keeping the read scope
tight ("credential vault namespace").

Operators who prefer strict per-secret least privilege set
``connectorCredentials.strictSecretNames``; the Role is then scoped to exactly
those Secret names (and adding a credential requires a redeploy).

Only rendered when the Dapr secret store is Kubernetes-backed (the eval default
``secretstores.kubernetes`` or the runtime's built-in ``kubernetes`` fallback).
HA installs that point the secret store at an external backend (e.g. Vault) read
credentials out-of-cluster, so this Kubernetes RBAC is not rendered for them.
*/}}
{{- $secretStoreIsK8s := true -}}
{{- if $components.secretStore.enabled -}}
{{- $secretStoreIsK8s = eq $components.secretStore.type "secretstores.kubernetes" -}}
{{- end -}}
{{- if $secretStoreIsK8s -}}
{{- if and $cc.createNamespace (ne $ns $releaseNs) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns | quote }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-connector-credential-reader
  namespace: {{ $ns | quote }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- with $cc.strictSecretNames }}
    # Strict mode: the connector service can read only these named Secrets.
    # Adding a new credential requires appending here + redeploy.
    resourceNames:
      {{- range . | uniq | sortAlpha }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-connector-credential-reader
  namespace: {{ $ns | quote }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-connector-credential-reader
subjects:
  # The connector service's daprd sidecar performs the Secrets API read using
  # the pod ServiceAccount. Cross-namespace binding: the SA lives in the release
  # namespace; the Role/binding live in the credential namespace.
  - kind: ServiceAccount
    name: {{ printf "%s-connector-service" .Release.Name }}
    namespace: {{ $releaseNs }}
{{- end }}
{{- end }}
