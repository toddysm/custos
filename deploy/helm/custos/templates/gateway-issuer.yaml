{{- $tls := .Values.gateway.tls.certManager -}}
{{- if and $tls.enabled $tls.issuer.create -}}
{{- $issuer := $tls.issuer -}}
{{- $ref := $tls.issuerRef -}}
# cert-manager Issuer that signs the Gateway serving certificate. A self-signed
# issuer keeps the chart portable for eval / air-gapped installs; switch
# `issuer.type` to `acme` (and set `acme.email`) for Let's Encrypt-style CAs.
apiVersion: cert-manager.io/v1
kind: {{ $ref.kind }}
metadata:
  name: {{ $ref.name | quote }}
  {{- if eq $ref.kind "Issuer" }}
  namespace: {{ include "custos.namespace" . }}
  {{- end }}
  labels:
    {{- include "custos.labels" . | nindent 4 }}
spec:
  {{- if eq $issuer.type "acme" }}
  acme:
    server: {{ $issuer.acme.server | quote }}
    email: {{ $issuer.acme.email | quote }}
    privateKeySecretRef:
      name: {{ $issuer.acme.privateKeySecretRef | quote }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: custos
                namespace: {{ include "custos.namespace" . }}
                kind: Gateway
  {{- else }}
  selfSigned: {}
  {{- end }}
{{- end }}
