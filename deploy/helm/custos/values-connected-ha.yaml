# Profile: connected + HA
# 3 replicas per service, CNPG 3-node Postgres, MinIO 4-node object store, ESO.

topology: connected
profile: ha

global:
  profile: ha
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Run the Dapr control plane in HA (multi-replica Sentry / Placement /
# Operator / Injector) to match the platform's HA topology.
dapr:
  global:
    ha:
      enabled: true

postgres:
  embedded: true
  instances: 3
  storageSize: 100Gi

objectStorage:
  embedded: true
  nodes: 4
  driveSize: 200Gi

# HA pub/sub broker: run Redis with a primary + replicas instead of the eval
# standalone. The Dapr pub/sub component still targets the `custos-redis-master`
# Service, so no component rewiring is needed.
redis:
  architecture: replication
  replica:
    replicaCount: 2

# HA log storage: move Loki off the eval filesystem onto the MinIO
# `custos-loki` bucket (design: object-storage chunks). The MinIO credentials
# are injected as env vars from the `custos-minio` Secret and expanded into the
# Loki config via `-config.expand-env=true`, so no plaintext keys land in the
# ConfigMap.
loki:
  loki:
    storage:
      type: s3
      bucketNames:
        chunks: custos-loki
        ruler: custos-loki
        admin: custos-loki
      s3:
        endpoint: minio:9000
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: custos-minio
            key: accessKey
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: custos-minio
            key: secretKey

secrets:
  backend: eso
  eso:
    enabled: true
    provider: vault
  sealed:
    enabled: false

oidc:
  mode: external
  issuer: https://login.microsoftonline.com/<tenant>/v2.0
  clientId: ""

gateway:
  hostname: custos.example.com

# In HA, catalog-service reads CAT_DEFINITION_STORE / CAT_CATALOG_STORE from a
# Secret materialized by ExternalSecret against the cluster secret store.
# Eval profiles leave this off and operators populate the DSNs by hand or
# via a pre-install Job.
catalog-service:
  externalSecret:
    enabled: true

# In HA, connector-service reads CONN_CATALOG_STORE / CONN_METADATA_STORE
# from a Secret materialized by ExternalSecret against the cluster secret
# store. Eval profiles leave this off and operators populate the DSNs by
# hand or via a pre-install Job.
connector-service:
  externalSecret:
    enabled: true
