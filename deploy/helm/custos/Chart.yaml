apiVersion: v2
name: custos
description: Custos — pluggable workflow orchestrator for OCI supply-chain security. Umbrella chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/toddysm/custos
sources:
  - https://github.com/toddysm/custos
maintainers:
  - name: Toddy Mladenov
    url: https://github.com/toddysm

dependencies:
  # Custos services
  - name: api-gateway
    version: 0.1.0
    repository: "file://../charts/api-gateway"
    condition: api-gateway.enabled
  - name: auth-service
    version: 0.1.0
    repository: "file://../charts/auth-service"
    condition: auth-service.enabled
  - name: workflow-service
    version: 0.1.0
    repository: "file://../charts/workflow-service"
    condition: workflow-service.enabled
  - name: trigger-service
    version: 0.1.0
    repository: "file://../charts/trigger-service"
    condition: trigger-service.enabled
  - name: connector-service
    version: 0.1.0
    repository: "file://../charts/connector-service"
    condition: connector-service.enabled
  - name: activity-runtime-manager
    version: 0.1.0
    repository: "file://../charts/activity-runtime-manager"
    condition: activity-runtime-manager.enabled
  - name: catalog-service
    version: 0.1.0
    repository: "file://../charts/catalog-service"
    condition: catalog-service.enabled
  - name: observability-audit-service
    version: 0.1.0
    repository: "file://../charts/observability-audit-service"
    condition: observability-audit-service.enabled
  # Platform dependencies
  - name: cnpg
    version: 0.1.0
    repository: "file://../charts/cnpg"
    condition: postgres.embedded
  - name: minio
    version: 0.1.0
    repository: "file://../charts/minio"
    condition: objectStorage.embedded
  - name: eso
    version: 0.1.0
    repository: "file://../charts/eso"
    condition: secrets.eso.enabled
  # Dapr control plane (vendored upstream subchart). Toggle with `dapr.install`;
  # set it false when Dapr is managed out-of-band / already installed.
  - name: dapr
    version: 1.14.0
    repository: "https://dapr.github.io/helm-charts/"
    condition: dapr.install
  # North-south ingress stack (vendored upstream subcharts). Toggle with
  # `envoyGateway.install` / `certManager.install`; set false when the cluster
  # already provides Envoy Gateway / cert-manager. The toggle keys are kept
  # separate from each subchart's own values namespace (`gateway-helm:` /
  # `cert-manager:`) because cert-manager ships a strict values schema that
  # rejects unknown keys.
  - name: gateway-helm
    version: 1.8.1
    repository: "oci://docker.io/envoyproxy"
    condition: envoyGateway.install
  - name: cert-manager
    version: v1.20.2
    repository: "https://charts.jetstack.io"
    condition: certManager.install
  # Observability pipeline (vendored upstream subcharts — DEPLOY-IMPL-014).
  # In-cluster sinks for metrics (Prometheus), traces/metrics ingestion (OTel
  # Collector), and logs (Loki). Each is toggled via the existing
  # `observability.<backend>.enabled` flag — a Custos-owned block kept separate
  # from each subchart's own values namespace (`prometheus:` / `loki:` /
  # `opentelemetry-collector:`) so the strict subchart schemas never see an
  # unknown toggle key.
  - name: prometheus
    version: 29.10.0
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: observability.prometheus.enabled
  - name: loki
    version: 6.55.0
    repository: "https://grafana.github.io/helm-charts"
    condition: observability.loki.enabled
  - name: opentelemetry-collector
    version: 0.158.1
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: observability.otelCollector.enabled
  # Pub/sub broker + optional air-gapped auth/secrets backends
  # (DEPLOY-IMPL-015, resolves design TODO-001). Redis is the Dapr pub/sub
  # fan-out broker (design D3) and installs with the Redis pub/sub component.
  # Keycloak (self-hosted OIDC) and Sealed Secrets (no-Vault Layer-2) are
  # optional and default-off; they reuse the existing `oidc.keycloak.enabled`
  # and `secrets.sealed.enabled` feature flags, mirroring the
  # `secrets.eso.enabled` -> eso subchart precedent. Each subchart keeps its own
  # values namespace (`redis:` / `keycloak:` / `sealed-secrets:`).
  - name: redis
    version: 27.0.4
    repository: "https://charts.bitnami.com/bitnami"
    condition: dapr.components.pubsub.redis.enabled
  - name: keycloak
    version: 25.2.0
    repository: "https://charts.bitnami.com/bitnami"
    condition: oidc.keycloak.enabled
  - name: sealed-secrets
    version: 2.18.6
    repository: "https://bitnami-labs.github.io/sealed-secrets"
    condition: secrets.sealed.enabled