apiVersion: v2
name: custos
description: Custos — pluggable workflow orchestrator for OCI supply-chain security. Umbrella chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/toddysm/custos
sources:
  - https://github.com/toddysm/custos
maintainers:
  - name: Toddy Mladenov
    url: https://github.com/toddysm

dependencies:
  # Custos services
  - name: api-gateway
    version: 0.1.0
    repository: "file://../charts/api-gateway"
    condition: api-gateway.enabled
  - name: auth-service
    version: 0.1.0
    repository: "file://../charts/auth-service"
    condition: auth-service.enabled
  - name: workflow-service
    version: 0.1.0
    repository: "file://../charts/workflow-service"
    condition: workflow-service.enabled
  - name: trigger-service
    version: 0.1.0
    repository: "file://../charts/trigger-service"
    condition: trigger-service.enabled
  - name: connector-service
    version: 0.1.0
    repository: "file://../charts/connector-service"
    condition: connector-service.enabled
  - name: activity-runtime-manager
    version: 0.1.0
    repository: "file://../charts/activity-runtime-manager"
    condition: activity-runtime-manager.enabled
  - name: catalog-service
    version: 0.1.0
    repository: "file://../charts/catalog-service"
    condition: catalog-service.enabled
  - name: observability-audit-service
    version: 0.1.0
    repository: "file://../charts/observability-audit-service"
    condition: observability-audit-service.enabled
  # Platform dependencies
  - name: cnpg
    version: 0.1.0
    repository: "file://../charts/cnpg"
    condition: postgres.embedded
  - name: minio
    version: 0.1.0
    repository: "file://../charts/minio"
    condition: objectStorage.embedded
  - name: eso
    version: 0.1.0
    repository: "file://../charts/eso"
    condition: secrets.eso.enabled
  # ---------------------------------------------------------------------------
  # Out-of-band prerequisites (NOT bundled — see #851/#852).
  #
  # The following upstream operators/CRD bundles are intentionally NOT vendored
  # as subchart dependencies. Bundling them pushed the packaged umbrella to
  # ~2 MB, and Helm stores the gzipped chart in the release Secret whose hard
  # cap is 1 MB — so `helm install` always failed with
  # `Secret "sh.helm.release.v1.<rel>.v1" is invalid: data: Too long`.
  #
  # Install these out-of-band BEFORE `helm install custos` (see
  # scripts/install-prereqs.sh and docs/users/evaluation/local-cluster.md):
  #   - dapr                     (https://dapr.github.io/helm-charts/, 1.14.0)
  #   - gateway-helm / Envoy GW  (oci://docker.io/envoyproxy, 1.8.1)
  #   - cert-manager             (https://charts.jetstack.io, v1.20.2)
  #   - prometheus               (prometheus-community, 29.10.0)
  #   - loki                     (grafana, 6.55.0)
  #   - opentelemetry-collector  (open-telemetry, 0.158.1)
  #   - redis                    (bitnami, 27.0.4)
  #   - keycloak                 (bitnami, 25.2.0; optional)
  #   - sealed-secrets           (bitnami-labs, 2.18.6; optional)
  #
  # The umbrella still ships its OWN resources that target these operators'
  # CRDs (Dapr Components/Subscriptions, Gateway/GatewayClass/Certificate,
  # Grafana dashboards) — those CRDs must exist (installed out-of-band) before
  # this chart is applied. The `dapr.install` / `envoyGateway.install` value
  # keys gate whether the umbrella renders those glue CRs (templates/dapr-*.yaml
  # and templates/gatewayclass.yaml); keep them at their default `true` so the
  # CRs render against the pre-installed CRDs. These keys are NOT read by
  # scripts/install-prereqs.sh — that script decides what to pre-install from
  # its own --flags and INSTALL_* environment variables.