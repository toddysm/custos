# Custos umbrella chart — baseline defaults.
#
# This file holds defaults common across all profiles. Profile-specific overrides
# live in values-<topology>-<profile>.yaml.

global:
  # Note: chart resources are namespaced via .Release.Namespace; pass the
  # target namespace at install time with `helm install -n <ns>` (or
  # `--create-namespace`). The chart itself does NOT create the namespace
  # by default — see the `namespace.create` toggle below.
  imageRegistry: ghcr.io/toddysm/custos
  imageTag: dev
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # correlationId header name minted by API Gateway and propagated downstream
  correlationIdHeader: x-correlation-id
  # Deployment profile exposed to every subchart (top-level `profile` is not
  # visible inside subcharts). HA-gated resources — HPA + PDB — render only
  # when this is "ha". Profile values files set it; defaults to "eval".
  profile: eval
  # Default replicas and resources for every service subchart. Each subchart
  # uses .Values.global.replicaCount / .Values.global.resources when its local
  # values are empty, so umbrella profiles can scale all services in one knob.
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # NetworkPolicy plumbing shared by the umbrella deny-all and every service
  # subchart's networkpolicy.yaml. Flip `enabled` on to turn on the umbrella
  # deny-all *and* every per-service allow set together (DEPLOY-IMPL-009).
  # DISABLED BY DEFAULT: enabling the deny-all without the allow set — or with
  # an incomplete one — blocks platform traffic (incl. DNS). The per-service
  # allow templates implement the design's Networking allow matrix; flip this
  # on once they are validated for the target cluster's namespace layout.
  networkPolicies:
    enabled: false
    # Namespace (by `kubernetes.io/metadata.name`) Prometheus scrapes from.
    monitoringNamespace: monitoring
    # Namespace the Envoy Gateway data plane runs in (north-south ingress).
    gatewayNamespace: custos-system
    # Cluster DNS namespace (egress on 53 is always required).
    dnsNamespace: kube-system
    # Dapr control-plane namespace (Sentry / Placement / Operator / Injector).
    daprNamespace: dapr-system
    # Dapr sidecar ports used for service-to-service invocation.
    daprPorts: [3500, 50001, 50002]
    # CNPG Postgres cluster pod selector + port (egress for DB-backed services).
    postgresPort: 5432
    postgresPodSelector:
      cnpg.io/cluster: custos

# Namespace management. By default the chart does NOT create the namespace
# (and therefore does not require cluster-scoped permissions); pass
# `--namespace custos-system --create-namespace` to `helm install` instead.
# Set namespace.create=true only when you want the chart itself to manage
# the namespace resource (and accept that the installer needs cluster-scoped
# RBAC and that helm install --create-namespace will conflict).
namespace:
  create: false
  name: ""

# Topology: connected | airgapped
topology: connected
# Profile: eval | ha
profile: eval

# Postgres (CloudNativePG)
postgres:
  embedded: true        # set false to bring your own
  instances: 1          # 1 for eval, 3 for HA
  storageSize: 20Gi
  storageClass: ""
  database: custos
  superuser: postgres
  # Connection secret consumed by the SPL migration Job and by every service
  # that needs DB credentials. Defaults to the Secret CloudNativePG creates
  # automatically for the application user of the Cluster named `custos`
  # (CNPG convention: <cluster-name>-app). The secret carries the keys
  # `username`, `password`, `host`, `port`, `dbname`, `uri`.
  #
  # If postgres.embedded=false (bring-your-own DB), set secretName to a
  # Secret you provision out-of-band with the same six keys.
  secretName: custos-app

# Object storage (MinIO) — only HA profiles enable this
objectStorage:
  embedded: false
  nodes: 4
  driveSize: 100Gi
  buckets:
    - custos-artifacts
    - custos-postgres-backups
    - custos-loki

# Secrets management
secrets:
  # Backend: eso | sealed
  backend: eso
  eso:
    enabled: true
    # ESO provider: vault | aws | azure | gcp
    provider: vault
    clusterSecretStoreName: custos-secret-store
  sealed:
    enabled: false

# OIDC identity provider
oidc:
  # external (GitHub/Entra) for connected; in-cluster Keycloak for airgapped
  mode: external
  issuer: ""
  clientId: ""
  clientSecretRef:
    name: custos-oidc
    key: clientSecret
  keycloak:
    enabled: false

# Envoy Gateway + Gateway API
gateway:
  className: envoy
  hostname: custos.local
  tlsSecretName: custos-gateway-tls

# Dapr sidecar injection (Dapr installed out-of-band)
dapr:
  enabled: true
  logLevel: info
  appProtocol: http

# Observability backends
observability:
  loki:
    enabled: true
    url: http://loki:3100
  prometheus:
    enabled: true
    url: http://prometheus-server
  otelCollector:
    enabled: true

# Default resource requests/limits applied to services without overrides.
# Subcharts read from .Values.global.resources via the umbrella, with
# .Values.resources here serving as the source for that propagation.
# (Local subchart overrides still win.)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Default replica count. Subcharts read .Values.global.replicaCount.
replicaCount: 1

# Pre-install/upgrade SPL migration Job
migrate:
  enabled: true
  image:
    repository: ghcr.io/toddysm/custos/custos-migrate
    tag: dev
  backoffLimit: 3

# Post-install/upgrade bootstrap Job (tenant-default, workspace-default, admin)
bootstrap:
  enabled: true
  image:
    repository: ghcr.io/toddysm/custos/custos-bootstrap
    tag: dev
  # The initial platform admin is pre-bound by their OIDC identity (issuer +
  # subject) so they can authenticate immediately after install. Both keys are
  # read from the referenced Secret and are optional.
  adminOidcRef:
    name: custos-bootstrap-admin
    issuerKey: oidcIssuer
    subjectKey: oidcSubject

# Subchart toggles (when umbrella renders subcharts)
api-gateway:
  enabled: true
auth-service:
  enabled: true
workflow-service:
  enabled: true
trigger-service:
  enabled: true
connector-service:
  enabled: true
activity-runtime-manager:
  enabled: true
catalog-service:
  enabled: true
observability-audit-service:
  enabled: true
