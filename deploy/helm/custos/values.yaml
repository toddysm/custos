# Custos umbrella chart — baseline defaults.
#
# This file holds defaults common across all profiles. Profile-specific overrides
# live in values-<topology>-<profile>.yaml.

global:
  # Note: chart resources are namespaced via .Release.Namespace; pass the
  # target namespace at install time with `helm install -n <ns>` (or
  # `--create-namespace`). The chart itself does NOT create the namespace
  # by default — see the `namespace.create` toggle below.
  #
  # `imageRegistry` is intentionally NOT set here. Custos service charts and the
  # umbrella default it to `ghcr.io/toddysm/custos`, so connected installs pull
  # Custos images from GHCR while the vendored third-party subcharts (Loki, OTel
  # Collector, …) keep their own upstream registries. The air-gapped overlays
  # set `global.imageRegistry: registry.internal/custos`, which then redirects
  # every chart that honours the Helm global (Custos services + Loki + OTel) to
  # the mirror in one knob. Prometheus does not read the global and is mirrored
  # explicitly in those overlays.
  imageTag: dev
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # correlationId header name minted by API Gateway and propagated downstream
  correlationIdHeader: x-correlation-id
  # Deployment profile exposed to every subchart (top-level `profile` is not
  # visible inside subcharts). HA-gated resources — HPA + PDB — render only
  # when this is "ha". Profile values files set it; defaults to "eval".
  profile: eval
  # Default replicas and resources for every service subchart. Each subchart
  # uses .Values.global.replicaCount / .Values.global.resources when its local
  # values are empty, so umbrella profiles can scale all services in one knob.
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # NetworkPolicy plumbing shared by the umbrella deny-all and every service
  # subchart's networkpolicy.yaml. Flip `enabled` on to turn on the umbrella
  # deny-all *and* every per-service allow set together (DEPLOY-IMPL-009).
  # DISABLED BY DEFAULT: enabling the deny-all without the allow set — or with
  # an incomplete one — blocks platform traffic (incl. DNS). The per-service
  # allow templates implement the design's Networking allow matrix; flip this
  # on once they are validated for the target cluster's namespace layout.
  networkPolicies:
    enabled: false
    # Namespace (by `kubernetes.io/metadata.name`) Prometheus scrapes from.
    monitoringNamespace: monitoring
    # Namespace the Envoy Gateway data plane runs in (north-south ingress).
    gatewayNamespace: custos-system
    # Cluster DNS namespace (egress on 53 is always required).
    dnsNamespace: kube-system
    # Dapr control-plane namespace (Sentry / Placement / Operator / Injector).
    daprNamespace: dapr-system
    # Dapr sidecar ports used for service-to-service invocation.
    daprPorts: [3500, 50001, 50002]
    # CNPG Postgres cluster pod selector + port (egress for DB-backed services).
    postgresPort: 5432
    postgresPodSelector:
      cnpg.io/cluster: custos

# Namespace management. By default the chart does NOT create the namespace
# (and therefore does not require cluster-scoped permissions); pass
# `--namespace custos-system --create-namespace` to `helm install` instead.
# Set namespace.create=true only when you want the chart itself to manage
# the namespace resource (and accept that the installer needs cluster-scoped
# RBAC and that helm install --create-namespace will conflict).
namespace:
  create: false
  name: ""

# Topology: connected | airgapped
topology: connected
# Profile: eval | ha
profile: eval

# Postgres (CloudNativePG)
postgres:
  embedded: true        # set false to bring your own
  instances: 1          # 1 for eval, 3 for HA
  storageSize: 20Gi
  storageClass: ""
  database: custos
  superuser: postgres
  # Connection secret consumed by the SPL migration Job and by every service
  # that needs DB credentials. Defaults to the Secret CloudNativePG creates
  # automatically for the application user of the Cluster named `custos`
  # (CNPG convention: <cluster-name>-app). The secret carries the keys
  # `username`, `password`, `host`, `port`, `dbname`, `uri`.
  #
  # If postgres.embedded=false (bring-your-own DB), set secretName to a
  # Secret you provision out-of-band with the same six keys.
  secretName: custos-app

# Object storage (MinIO) — only HA profiles enable this
objectStorage:
  embedded: false
  nodes: 4
  driveSize: 100Gi
  buckets:
    - custos-artifacts
    - custos-postgres-backups
    - custos-loki

# Secrets management
secrets:
  # Backend: eso | sealed
  backend: eso
  eso:
    enabled: true
    # ESO provider: vault | aws | azure | gcp
    provider: vault
    clusterSecretStoreName: custos-secret-store
  sealed:
    enabled: false

# OIDC identity provider
oidc:
  # external (GitHub/Entra) for connected; in-cluster Keycloak for airgapped
  mode: external
  issuer: ""
  clientId: ""
  clientSecretRef:
    name: custos-oidc
    key: clientSecret
  keycloak:
    enabled: false

# Envoy Gateway + Gateway API
gateway:
  className: envoy
  hostname: custos.local
  tlsSecretName: custos-gateway-tls
  # Serving certificate for the Gateway HTTPS listener, issued by cert-manager.
  # The Certificate populates `tlsSecretName`, which the Gateway listener
  # references. Set `gateway.tls.certManager.enabled: false` to supply the TLS
  # Secret out-of-band instead.
  tls:
    certManager:
      enabled: true
      # Issuer the Certificate references. When `issuer.create` is true the
      # chart templates this Issuer; otherwise it must already exist.
      issuerRef:
        name: custos-gateway-issuer
        # Issuer (namespaced) | ClusterIssuer (cluster-scoped).
        kind: Issuer
      issuer:
        create: true
        # selfSigned (portable eval / air-gapped default) | acme (Let's Encrypt
        # or other ACME CA — set `acme.email` and switch type to use it).
        type: selfSigned
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: ""
          privateKeySecretRef: custos-gateway-acme-key

# North-south ingress (vendored upstream subcharts — DEPLOY-IMPL-013).
# `install: true` brings each up with a single `helm install`; set it false when
# the cluster already provides Envoy Gateway / cert-manager (the dependency is
# then skipped via its `*.install` condition). These toggle keys are separate
# from the subcharts' own value namespaces (`gateway-helm:` / `cert-manager:`)
# because cert-manager ships a strict values schema.
envoyGateway:
  install: true
certManager:
  install: true

# cert-manager subchart values. CRDs ship in-chart so a fresh cluster needs no
# separate CRD apply; `imageRegistry` (default quay.io) is overridden for
# air-gapped mirrors. The Envoy Gateway subchart needs no image override here —
# it reads the umbrella `global.imageRegistry`, which already routes its images
# to the mirror in the air-gapped profiles.
cert-manager:
  crds:
    enabled: true
  imageRegistry: quay.io

# Dapr control plane (vendored upstream subchart — DEPLOY-IMPL-011).
# `install: true` brings the control plane up with a single `helm install`; set
# it to false when Dapr is managed out-of-band (the dependency is then skipped
# via its `dapr.install` condition). Per-service sidecar injection is configured
# in each service subchart's own `dapr:` block, independent of this control
# plane toggle.
#
# Image mirroring: the upstream chart pulls from its own `global.registry`
# (Dapr convention), which is distinct from the Custos `global.imageRegistry`.
# For air-gapped installs, point `dapr.global.registry` at the same mirror you
# use for `global.imageRegistry` (the profile overlays do this).
dapr:
  install: true
  global:
    registry: ghcr.io/dapr
    tag: "1.14.0"
    # Control-plane high availability — flipped on by the HA profile overlays.
    ha:
      enabled: false

  # Pre-install readiness gate for the Dapr sidecar injector (issue #847).
  # Dapr is installed out-of-band into `injectorReadyGate.namespace` BEFORE the
  # umbrella (scripts/install-prereqs.sh). On a cold start the injector's mutating
  # webhook may not yet be serving when the service pods are created; because the
  # webhook runs `failurePolicy: Ignore`, those pods come up with NO sidecar (1/1
  # not 2/2) and `helm install --wait` then times out. This pre-install hook Job
  # blocks until the injector Deployment is Ready, so the Dapr-enabled service
  # Deployments that follow are injected on first creation. Disable only when Dapr
  # sidecar injection is not used.
  injectorReadyGate:
    enabled: true
    # Namespace the out-of-band Dapr control plane (sidecar injector) runs in.
    namespace: dapr-system
    # Injector Deployment name to wait on (upstream Dapr chart default).
    injectorDeployment: dapr-sidecar-injector
    # How long the hook waits for the injector Deployment to become Ready.
    timeout: 180s
    backoffLimit: 3
    image:
      # Standalone kubectl image (distroless — invoked via its entrypoint, no
      # shell). Mirror for air-gapped installs — see deploy/offline/images.txt.
      repository: registry.k8s.io/kubectl
      tag: v1.31.4
      # Falls back to global.imagePullPolicy when empty.
      pullPolicy: ""

  # Dapr building-block CRs (DEPLOY-IMPL-012). The Component + Subscription CRs
  # below are rendered only when `dapr.install` is true; each is individually
  # toggleable. Secret-backed metadata is resolved through the built-in
  # `kubernetes` secret store, so plaintext credentials never live in the CRs.
  components:
    # State store backed by the CNPG Postgres cluster. Reads the libpq URI from
    # the CNPG application secret (postgres.secretName) — same secret the
    # migration Job and services consume.
    stateStore:
      enabled: true
      name: custos-statestore
      # Secret + key holding the Postgres connection URI. Empty secret name
      # falls back to postgres.secretName.
      connectionSecret: ""
      connectionKey: uri
      # Dapr Workflow is built on the actor model (REQ-046), so the workflow
      # engine only starts once a state store is flagged as the actor state
      # store. Without this the workflow-service sidecar never hosts the
      # workflow engine and the worker never reports ready (issue #816). Keep
      # this on the CNPG-backed store so workflow/actor state shares the same
      # durable Postgres cluster the services already consume.
      actorStateStore: true
    # Dapr secret store wired to the Layer-1 backend. Defaults to the built-in
    # Kubernetes secret store (eval); HA installs point `type` at the same
    # backend ESO manages (e.g. secretstores.hashicorp.vault).
    secretStore:
      enabled: true
      name: custos-secretstore
      type: secretstores.kubernetes
      version: v1
      # Free-form metadata entries ({name, value}) for non-kubernetes backends.
      metadata: []
    # Pub/sub: Redis broker for low-latency fan-out plus a Postgres-backed
    # component for durable, state-aligned messaging (design decision D3).
    pubsub:
      # Fan-out broker. Services reference this component name by default
      # (custos-pubsub — see the trigger/connector service settings).
      redis:
        enabled: true
        name: custos-pubsub
        # Redis broker address (the Redis subchart lands in DEPLOY-IMPL-015).
        host: custos-redis-master:6379
        # Secret + key holding the Redis password.
        passwordSecret: custos-redis
        passwordKey: redis-password
      # Durable messaging on Postgres, sharing the CNPG cluster.
      #
      # DISABLED: the pinned Dapr runtime (1.14.0, see Chart.yaml /
      # scripts/install-prereqs.sh) ships NO Postgres pub/sub component — daprd
      # 1.14 has no `pubsub.postgres`/`pubsub.postgresql` building block at all
      # (only state.postgresql, bindings.postgres, configuration.postgres). With
      # this enabled every service sidecar fails component init with
      # `couldn't find message bus pubsub.postgresql/v1` and CrashLoopBackOffs,
      # taking the whole control plane down. Nothing consumes this component yet
      # (no Subscription or service references `custos-pubsub-durable`), so it is
      # off by default. Re-enable only once the out-of-band Dapr is bumped to a
      # release that includes the Postgres pub/sub component (>= 1.15).
      postgres:
        enabled: false
        name: custos-pubsub-durable
        connectionSecret: ""
        connectionKey: uri

  # Declarative Subscription CRs for the platform's pub/sub consumers. Both the
  # trigger-service and the observability-audit-service consume the workflow
  # lifecycle stream (`custos.workflow.events`): the trigger-service to fire
  # matching triggers, the observability-audit-service for trace/metric
  # correlation (its audit trail itself arrives via the SPL outbox drain, not
  # pub/sub). `scopes` restricts delivery to the named Dapr app-ids.
  subscriptions:
    triggerWorkflowEvents:
      enabled: true
      name: trigger-workflow-events
      pubsub: custos-pubsub
      topic: custos.workflow.events
      route: /internal/events/workflow
      scopes:
        - trigger-service
    observabilityWorkflowEvents:
      enabled: true
      name: observability-workflow-events
      pubsub: custos-pubsub
      topic: custos.workflow.events
      route: /internal/events/workflow
      scopes:
        - observability-audit-service

# Observability backends
#
# The `enabled` flags double as the install toggles for the vendored upstream
# subcharts (DEPLOY-IMPL-014): flip one off to skip rendering that backend (the
# dependency is dropped via its `observability.<backend>.enabled` condition) when
# the cluster already provides the sink out-of-band. The `url` values point the
# observability-audit-service at the in-cluster Service names the subcharts
# render (release-prefixed).
observability:
  loki:
    enabled: true
    url: http://custos-loki:3100
  prometheus:
    enabled: true
    url: http://custos-prometheus-server
  otelCollector:
    enabled: true
  # Grafana dashboard bundle (DEPLOY-IMPL-020 / design TODO-005). Each JSON under
  # `dashboards/` ships as a ConfigMap carrying the sidecar discovery label so an
  # operator-supplied Grafana (kiwigrid/k8s-sidecar dashboard provider) imports
  # them automatically. The chart does NOT install Grafana; flip `enabled: false`
  # if you import the dashboards by hand instead.
  grafanaDashboards:
    enabled: true
    # Label the Grafana dashboard sidecar watches for.
    label: grafana_dashboard
    labelValue: "1"
    # Folder the sidecar files the dashboards under (via the folder annotation).
    # Set `folder: ""` to skip the annotation and use the sidecar default folder.
    folder: Custos
    folderAnnotation: grafana_folder

# --- Vendored observability subchart values (DEPLOY-IMPL-014) ------------------
# These namespaces carry ONLY valid upstream subchart values; the install
# toggles live under `observability:` above so the strict subchart schemas never
# see an unknown key. Air-gapped image mirroring is handled in the profile
# overlays.

# Prometheus — single server instance with a PV-backed TSDB (design:
# "Prometheus single instance, PV"). The bundled alertmanager / pushgateway /
# node-exporter / kube-state-metrics are disabled to keep the footprint to the
# server that scrapes the per-service `/metrics` endpoints.
prometheus:
  server:
    replicaCount: 1
    persistentVolume:
      enabled: true
      size: 20Gi
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: false
  # Scrape the Custos services' `/metrics` endpoints. The vendored
  # prometheus-community chart has no Prometheus Operator, so ServiceMonitors do
  # not apply; this static job uses Kubernetes pod discovery instead. Every
  # Custos service container exposes a port named `http` (the app port that also
  # serves `/metrics`), whereas the vendored sinks and the Dapr sidecar use
  # differently-named ports — so keeping only the `http` port targets exactly the
  # Custos workloads. Rendered through the chart's `tpl`, hence `.Release.*`.
  extraScrapeConfigs: |
    - job_name: custos-services
      metrics_path: /metrics
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - {{ .Release.Namespace }}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          regex: http
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          target_label: app

# Loki — single-binary deployment with filesystem storage (design: "Loki
# single-binary, filesystem" for eval). HA profiles swap `loki.storage` to the
# MinIO `custos-loki` bucket. The caches / gateway / canary are disabled so the
# eval footprint stays to one pod.
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: filesystem
    limits_config:
      retention_period: 744h
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

# OpenTelemetry Collector — a single deployment that ingests OTLP from the
# services. The shipped pipeline uses the `debug` exporter as a safe default;
# operators add exporters (e.g. otlphttp → Loki, prometheus remote-write) for
# their chosen backends. The `${env:MY_POD_IP}` receiver endpoints resolve via
# the `MY_POD_IP` env var the upstream chart injects into the collector Pod. The
# contrib image is pinned so the air-gapped mirror has a deterministic source.
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib
  presets:
    kubernetesAttributes:
      enabled: false
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]

# Redis — Dapr pub/sub broker (design decision D3). Installs whenever the Redis
# pub/sub component is enabled (`dapr.components.pubsub.redis.enabled`). The Dapr
# Component CR points at the `custos-redis-master` Service and the `custos-redis`
# Secret (key `redis-password`) that this chart provisions, so the names must
# stay aligned. The default is a single standalone broker (HA overlays switch to
# replication). Images honour the umbrella `global.imageRegistry`, so the
# air-gapped overlays mirror them automatically. Bitnami's free tier publishes
# only the `latest` image tag; pin `redis.image.tag` (and mirror that tag) for a
# reproducible install.
redis:
  architecture: standalone
  auth:
    enabled: true
  master:
    persistence:
      enabled: true
      size: 8Gi
  # The umbrella owns network policy as an explicit, all-or-nothing decision
  # (`global.networkPolicies.enabled`), so suppress the chart's own bundled
  # NetworkPolicy to avoid an always-on policy outside that toggle.
  networkPolicy:
    enabled: false

# Keycloak — optional self-hosted OIDC issuer for air-gapped installs (resolves
# design TODO-001). Default-off; the air-gapped overlays enable it via
# `oidc.keycloak.enabled`. The bundled Postgres backs Keycloak's own state;
# operators can repoint it at an external database. Images honour the umbrella
# `global.imageRegistry`, so the air-gapped overlays mirror them automatically.
# As with Redis, pin `keycloak.image.tag` for a reproducible install (Bitnami's
# free tier ships only `latest`).
keycloak:
  production: false
  auth:
    adminUser: admin
  # As with Redis, leave network policy to the umbrella's all-or-nothing toggle.
  networkPolicy:
    enabled: false
  # The bundled Postgres ships its own NetworkPolicy too; suppress it for the
  # same reason.
  postgresql:
    networkPolicy:
      enabled: false

# Sealed Secrets — optional no-Vault Layer-2 secret mechanism (design: no-vault
# alternative). Default-off; the air-gapped overlays enable it via
# `secrets.sealed.enabled`. This chart pins `image.registry` and does NOT read
# the umbrella `global.imageRegistry`, so the air-gapped overlays repoint
# `sealed-secrets.image.registry` at the mirror explicitly.
sealed-secrets: {}

# Default resource requests/limits applied to services without overrides.
# Subcharts read from .Values.global.resources via the umbrella, with
# .Values.resources here serving as the source for that propagation.
# (Local subchart overrides still win.)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Default replica count. Subcharts read .Values.global.replicaCount.
replicaCount: 1

# Pre-install/upgrade SPL migration Job
migrate:
  enabled: true
  image:
    repository: ghcr.io/toddysm/custos/custos-migrate
    tag: dev
  backoffLimit: 3

# Post-install/upgrade bootstrap Job (tenant-default, workspace-default, admin)
bootstrap:
  enabled: true
  image:
    repository: ghcr.io/toddysm/custos/custos-bootstrap
    tag: dev
  # The initial platform admin is pre-bound by their OIDC identity (issuer +
  # subject) so they can authenticate immediately after install. Both keys are
  # read from the referenced Secret and are optional.
  adminOidcRef:
    name: custos-bootstrap-admin
    issuerKey: oidcIssuer
    subjectKey: oidcSubject

# Subchart toggles (when umbrella renders subcharts)
api-gateway:
  enabled: true
auth-service:
  enabled: true
workflow-service:
  enabled: true
trigger-service:
  enabled: true
connector-service:
  enabled: true
activity-runtime-manager:
  enabled: true
catalog-service:
  enabled: true
observability-audit-service:
  enabled: true

# helm test synthetic scenario (DEPLOY-IMPL-018). `helm test <release>` runs a
# Pod that drives the public API through the api-gateway Service:
#   1. waits for /readyz, then checks /healthz + /openapi.json (always), and
#   2. when a bearer token is supplied, runs the end-to-end scenario:
#      verify token -> create workspace -> register connector ->
#      (optional) start workflow run -> poll run status to a terminal state.
# The authenticated scenario is opt-in: without `tests.auth.tokenSecret` the
# test only exercises readiness/reachability, so `helm test` stays green on a
# healthy release that has no seeded credentials.
tests:
  enabled: true
  image:
    # Defaults to the api-gateway image (Python stdlib only — nothing extra to
    # mirror for air-gapped). Override to pin a dedicated test client.
    repository: ""
    tag: ""
    pullPolicy: ""
  # In-cluster api-gateway Service. serviceName empty -> <release>-api-gateway.
  gateway:
    serviceName: ""
    port: 8080
  # Bearer token enabling the authenticated end-to-end scenario. Point at an
  # existing Secret + key holding a Custos service token (cst_...). Leave
  # tokenSecret empty to run readiness/reachability checks only.
  auth:
    tokenSecret: ""
    tokenKey: token
  # Seeded tenant the workspace is created under (bootstrap seeds tenant-default).
  tenantId: tenant-default
  # Workspace id the scenario creates (re-runs tolerate an existing workspace).
  workspaceId: ws-smoke-test
  # When set, the scenario starts a run for this published workflow version and
  # polls it to a terminal status. Leave empty to skip the workflow/run steps.
  workflowVersionId: ""
  # Timeouts (seconds).
  readyTimeoutSeconds: 120
  runPollTimeoutSeconds: 120
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
