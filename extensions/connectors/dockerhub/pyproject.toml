[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-dockerhub-plugin"
version = "0.1.0"
description = "Out-of-the-box Docker Hub connector plugin (custos-dockerhub@0.1.0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]

# The plugin implements the Connector Service Plugin Runtime hook
# contract (`bind`, `health`) over stdin/stdout JSON. It does not link
# against the connector-service Python package — that would couple the
# plugin's image to the service's release cadence. The contract is a
# stable JSON-over-pipes ABI documented in
# ``docs/developers/connector-plugin-author.md``.
#
# ``httpx`` is the only runtime dependency: the ``health`` hook makes a
# single live, *unauthenticated* ``GET /v2/`` reachability probe against
# Docker Hub. No other hook performs network I/O.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.0",
    "respx>=0.21",
    "types-jsonschema>=4.0",
]

[project.scripts]
custos-dockerhub-plugin = "dockerhub_plugin.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerhub_plugin"]

[tool.hatch.build.targets.wheel.force-include]
# Hatchling includes ``py.typed`` automatically for packages it
# discovers, but force-include guarantees the PEP 561 marker is present
# in the wheel even if the auto-discovery rules change.
"src/dockerhub_plugin/py.typed" = "dockerhub_plugin/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
