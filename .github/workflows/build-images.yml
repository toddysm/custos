name: build-images

# Reusable image build/publish workflow (DEPLOY-IMPL-006).
#
# Builds and pushes all ten Custos images to ``ghcr.io/<owner>/custos/<name>``,
# stamping the agreed immutable OCI manifest annotations
# (``org.opencontainers.image.*`` + ``vnd.custos.build.*``). The annotations are
# applied with ``docker buildx --annotation`` so they bind to the image
# *manifest* (content-addressed, immutable) rather than the mutable config
# labels — see design/architecture/reference-deployment.md § OCI image
# annotations.
#
# Triggers:
#   * push to ``main``         — build changed images, tag ``:dev`` + ``:sha-...``
#   * push of a ``v*.*.*`` tag — build all images, tag ``:vX.Y.Z`` + ``:sha-...``
#   * ``workflow_call``        — build all images (so the release + offline
#                                jobs can reuse this exact build/annotate path)
#   * ``workflow_dispatch``    — manual full rebuild

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        required: false
    outputs:
      images:
        description: "JSON array of the image references that were built."
        value: ${{ jobs.collect.outputs.images }}
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Resolve which images to build. On a branch push only the images whose
  # sources changed are rebuilt (per-image path filters); on tags, manual
  # dispatch, or ``workflow_call`` every image is built. Shared ``src/libs/**``
  # changes rebuild all images because the libraries are vendored into every
  # image at build time.
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Detect changed image sources
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            libs:
              - "src/libs/**"
              - ".github/workflows/build-images.yml"
            api-gateway:
              - "src/services/api-gateway/**"
            auth-service:
              - "src/services/auth-service/**"
            workflow-service:
              - "src/services/workflow-service/**"
            trigger-service:
              - "src/services/trigger-service/**"
            connector-service:
              - "src/services/connector-service/**"
            activity-runtime-manager:
              - "src/services/activity-runtime-manager/**"
            catalog-service:
              - "src/services/catalog-service/**"
            observability-audit-service:
              - "src/services/observability-audit-service/**"
            migrate:
              - "src/jobs/migrate/**"
            bootstrap:
              - "src/jobs/bootstrap/**"

      - name: Build matrix
        id: matrix
        env:
          # Build everything unless this is a plain branch push (where the
          # per-image path filters decide). Tags, dispatch, and workflow_call
          # always rebuild the full set.
          BUILD_ALL: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
          LIBS_CHANGED: ${{ steps.changes.outputs.libs }}
          CHANGED_JSON: ${{ toJSON(steps.changes.outputs) }}
        run: |
          set -euo pipefail
          # Canonical image table: title = OCI image title / component name;
          # image = registry path suffix; dockerfile = path from repo root.
          # Service images are ``custos/<svc>``; job images are
          # ``custos/custos-<job>`` to match the Helm hook image references.
          python3 - "$BUILD_ALL" "$LIBS_CHANGED" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          build_all = sys.argv[1] == "true"
          libs_changed = sys.argv[2] == "true"
          changed = json.loads(os.environ["CHANGED_JSON"])

          services = [
              "api-gateway",
              "auth-service",
              "workflow-service",
              "trigger-service",
              "connector-service",
              "activity-runtime-manager",
              "catalog-service",
              "observability-audit-service",
          ]
          jobs = ["migrate", "bootstrap"]

          table = []
          for svc in services:
              table.append({
                  "key": svc,
                  "title": svc,
                  "image": f"custos/{svc}",
                  "dockerfile": f"src/services/{svc}/Dockerfile",
              })
          for job in jobs:
              table.append({
                  "key": job,
                  "title": f"custos-{job}",
                  "image": f"custos/custos-{job}",
                  "dockerfile": f"src/jobs/{job}/Dockerfile",
              })

          selected = [
              e for e in table
              if build_all or libs_changed or changed.get(e["key"]) == "true"
          ]
          matrix = {"include": selected}
          print("matrix=" + json.dumps(matrix))
          print("any=" + ("true" if selected else "false"))
          PY

  build:
    name: ${{ matrix.title }} (build + push)
    needs: setup
    if: needs.setup.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and annotations
        id: meta
        env:
          IMAGE_TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${IMAGE}:${VERSION},${SHA_TAG}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            VERSION="dev"
            TAGS="${IMAGE}:dev,${SHA_TAG}"
          else
            VERSION="dev"
            TAGS="${SHA_TAG}"
          fi
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Immutable OCI manifest annotations (design § OCI image annotations).
          # ``--annotation key=value`` binds these to the image manifest.
          {
            echo "annotations<<EOF"
            echo "org.opencontainers.image.created=${CREATED}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.title=${IMAGE_TITLE}"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            echo "vnd.custos.build.tag=${VERSION}"
            echo "vnd.custos.build.actor=${GITHUB_ACTOR}"
            echo "vnd.custos.build.agent=github-actions"
            echo "vnd.custos.build.run-id=${GITHUB_RUN_ID}"
            echo "vnd.custos.build.run-url=${RUN_URL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "primary=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # Bind the annotations to the image manifest (not just config labels).
          annotations: ${{ steps.meta.outputs.annotations }}
          # Push a plain single-platform image manifest so the annotations land
          # directly on the manifest. SLSA provenance (DEPLOY-IMPL-008) and SBOM
          # (DEPLOY-IMPL-007) attestations layer on in their own workflows.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}

      - name: Verify manifest annotations
        env:
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          # Confirm the agreed annotations landed on the image *manifest*.
          ANNOTATIONS="$(docker buildx imagetools inspect "$PRIMARY" \
            --format '{{json .Manifest.Annotations}}')"
          echo "$ANNOTATIONS" | python3 -m json.tool
          echo "$ANNOTATIONS" | python3 - <<'PY'
          import json, sys
          ann = json.load(sys.stdin) or {}
          required = [
              "org.opencontainers.image.created",
              "org.opencontainers.image.version",
              "org.opencontainers.image.revision",
              "org.opencontainers.image.source",
              "org.opencontainers.image.title",
              "org.opencontainers.image.licenses",
              "vnd.custos.build.tag",
              "vnd.custos.build.actor",
              "vnd.custos.build.agent",
              "vnd.custos.build.run-id",
              "vnd.custos.build.run-url",
          ]
          missing = [k for k in required if k not in ann]
          if missing:
              raise SystemExit(f"manifest missing required annotations: {missing}")
          print("all required manifest annotations present")
          PY

  # Aggregate the built image references so ``workflow_call`` consumers (release
  # + offline bundle) can fan out from a single output.
  collect:
    name: Collect image references
    needs: [setup, build]
    if: always() && needs.setup.outputs.any == 'true'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Assemble image list
        id: collect
        env:
          MATRIX: ${{ needs.setup.outputs.matrix }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          matrix = json.loads(os.environ["MATRIX"])["include"]
          owner = os.environ["OWNER"]
          images = [f"ghcr.io/{owner}/{e['image']}" for e in matrix]
          print("images=" + json.dumps(images))
          PY
