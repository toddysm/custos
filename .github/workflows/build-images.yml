name: build-images

# Reusable image build/publish workflow (DEPLOY-IMPL-006, 007, 008).
#
# Builds and pushes all ten Custos images to ``ghcr.io/<owner>/custos/<name>``,
# stamping the agreed immutable OCI manifest annotations
# (``org.opencontainers.image.*`` + ``vnd.custos.build.*``). The annotations are
# applied with ``docker buildx --annotation`` so they bind to the image
# *manifest* (content-addressed, immutable) rather than the mutable config
# labels — see design/architecture/reference-deployment.md § OCI image
# annotations.
#
# Each image is additionally accompanied by a Syft SBOM (SPDX + CycloneDX)
# attached as a signed in-toto attestation, an SLSA provenance attestation
# (builder identity, source, materials), and the image manifest itself is
# keyless-signed with cosign via GitHub OIDC (Fulcio + Rekor) — see the
# ``./.github/actions/sbom-sign`` and ``./.github/actions/slsa-provenance``
# composite actions, the supply-chain attestations section of the design, and
# docs/operations/supply-chain-verification.md for the verification policy.
#
# Triggers:
#   * push to ``main``         — build changed images, tag ``:dev`` + ``:sha-...``
#   * push of a ``v*.*.*`` tag — build all images, tag ``:vX.Y.Z`` + ``:sha-...``
#   * ``workflow_call``        — build all images (so the release + offline
#                                jobs can reuse this exact build/annotate path)
#   * ``workflow_dispatch``    — manual full rebuild

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        required: false
    outputs:
      images:
        description: "JSON array of the image references that were built."
        value: ${{ jobs.collect.outputs.images }}
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Resolve which images to build. On a branch push only the images whose
  # sources changed are rebuilt (per-image path filters); on tags, manual
  # dispatch, or ``workflow_call`` every image is built. Shared ``src/libs/**``
  # changes rebuild all images because the libraries are vendored into every
  # image at build time.
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Detect changed image sources
        id: changes
        # paths-filter relies on a well-defined commit range, which only exists
        # for ``push`` events. For tags, manual dispatch, and ``workflow_call``
        # BUILD_ALL forces a full rebuild, so the per-image diff is not needed.
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            libs:
              - "src/libs/**"
              - ".github/workflows/build-images.yml"
            api-gateway:
              - "src/services/api-gateway/**"
            auth-service:
              - "src/services/auth-service/**"
            workflow-service:
              - "src/services/workflow-service/**"
            trigger-service:
              - "src/services/trigger-service/**"
            connector-service:
              - "src/services/connector-service/**"
            activity-runtime-manager:
              - "src/services/activity-runtime-manager/**"
            catalog-service:
              - "src/services/catalog-service/**"
            observability-audit-service:
              - "src/services/observability-audit-service/**"
            migrate:
              - "src/jobs/migrate/**"
            bootstrap:
              - "src/jobs/bootstrap/**"

      - name: Build matrix
        id: matrix
        env:
          # Build everything unless this is a plain branch push (where the
          # per-image path filters decide). Tags, dispatch, and workflow_call
          # always rebuild the full set.
          BUILD_ALL: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
          LIBS_CHANGED: ${{ steps.changes.outputs.libs }}
          CHANGED_JSON: ${{ toJSON(steps.changes.outputs) }}
        run: |
          set -euo pipefail
          # Canonical image table: title = OCI image title / component name;
          # image = registry path suffix; dockerfile = path from repo root.
          # Service images are ``custos/<svc>``; job images are
          # ``custos/custos-<job>`` to match the Helm hook image references.
          python3 - "$BUILD_ALL" "$LIBS_CHANGED" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          build_all = sys.argv[1] == "true"
          libs_changed = sys.argv[2] == "true"
          # CHANGED_JSON is "null"/"{}" when the change-detection step is skipped
          # (tags/dispatch/workflow_call); fall back to an empty mapping.
          changed = json.loads(os.environ["CHANGED_JSON"]) or {}

          services = [
              "api-gateway",
              "auth-service",
              "workflow-service",
              "trigger-service",
              "connector-service",
              "activity-runtime-manager",
              "catalog-service",
              "observability-audit-service",
          ]
          jobs = ["migrate", "bootstrap"]

          table = []
          for svc in services:
              table.append({
                  "key": svc,
                  "title": svc,
                  "image": f"custos/{svc}",
                  "dockerfile": f"src/services/{svc}/Dockerfile",
                  # Service/job images depend on in-repo path libraries, so
                  # they build from the repository root.
                  "context": ".",
              })
          for job in jobs:
              table.append({
                  "key": job,
                  "title": f"custos-{job}",
                  "image": f"custos/custos-{job}",
                  "dockerfile": f"src/jobs/{job}/Dockerfile",
                  "context": ".",
              })

          # connector-sidecar is a release image (it ships in images.txt and the
          # chart references it), but on main it is built+pushed by
          # python-services.yml gated on its mTLS/E2E integration tests. Build
          # it here only for full/release builds (tags, dispatch, workflow_call)
          # so the release pipeline + offline bundle get connector-sidecar:vX.Y.Z
          # without double-building it on every main push. Unlike the path-lib
          # services it is self-contained, so its build context is the service
          # directory (no monorepo copy step).
          if build_all:
              table.append({
                  "key": "connector-sidecar",
                  "title": "connector-sidecar",
                  "image": "custos/connector-sidecar",
                  "dockerfile": "src/services/connector-sidecar/Dockerfile",
                  "context": "src/services/connector-sidecar",
              })

          selected = [
              e for e in table
              if build_all or libs_changed or changed.get(e["key"]) == "true"
          ]
          matrix = {"include": selected}
          print("matrix=" + json.dumps(matrix))
          print("any=" + ("true" if selected else "false"))
          PY

  build:
    name: ${{ matrix.title }} (build + push)
    needs: setup
    if: needs.setup.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing via the ambient GitHub OIDC token (Fulcio).
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and annotations
        id: meta
        env:
          IMAGE_TITLE: ${{ matrix.title }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Derive tags/annotations from the commit that was *actually* checked
          # out (``inputs.ref`` under workflow_call may differ from the calling
          # run's GITHUB_SHA/GITHUB_REF).
          BUILD_SHA="$(git rev-parse HEAD)"
          BUILD_REF="${INPUT_REF:-$GITHUB_REF}"
          SHA_TAG="${IMAGE}:sha-${BUILD_SHA::12}"
          if [[ "${BUILD_REF}" == refs/tags/v*.*.* ]]; then
            VERSION="${BUILD_REF#refs/tags/}"
            TAGS="${IMAGE}:${VERSION},${SHA_TAG}"
          elif [[ "${BUILD_REF}" == "refs/heads/main" || "${BUILD_REF}" == "main" ]]; then
            VERSION="dev"
            TAGS="${IMAGE}:dev,${SHA_TAG}"
          else
            VERSION="dev"
            TAGS="${SHA_TAG}"
          fi
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Immutable OCI manifest annotations (design § OCI image annotations).
          # ``--annotation key=value`` binds these to the image manifest.
          {
            echo "annotations<<EOF"
            echo "org.opencontainers.image.created=${CREATED}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${BUILD_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.title=${IMAGE_TITLE}"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            echo "vnd.custos.build.tag=${VERSION}"
            echo "vnd.custos.build.actor=${GITHUB_ACTOR}"
            echo "vnd.custos.build.agent=github-actions"
            echo "vnd.custos.build.run-id=${GITHUB_RUN_ID}"
            echo "vnd.custos.build.run-url=${RUN_URL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          # Inspect the immutable sha tag, which is always pushed (the
          # ``:dev``/``:vX.Y.Z`` tag is absent for non-main, non-tag builds).
          echo "primary=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # Bind the annotations to the image manifest (not just config labels).
          annotations: ${{ steps.meta.outputs.annotations }}
          # Push a plain single-platform image manifest so the annotations land
          # directly on the manifest. SLSA provenance (DEPLOY-IMPL-008) layers
          # on in its own workflow; the Syft SBOM + cosign signing below attach
          # as referrers rather than inline manifest descriptors.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}

      - name: Verify manifest annotations
        env:
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          # Confirm the agreed annotations landed on the image *manifest*.
          # ``imagetools inspect --raw`` returns the pushed manifest JSON, whose
          # top-level ``.annotations`` carries the ``--annotation`` values. (The
          # ``--format '{{json .Manifest.Annotations}}'`` template reads the
          # *descriptor*-level annotations, which are empty for these
          # single-platform manifests, so it must not be used here.)
          #
          # Write the manifest to a file rather than piping into ``python3 -``:
          # a heredoc-fed ``python3 - <<'PY'`` takes its *program* from the
          # heredoc, so a piped manifest would never reach ``sys.stdin``.
          docker buildx imagetools inspect "$PRIMARY" --raw > manifest.json
          python3 - <<'PY'
          import json
          with open("manifest.json") as fh:
              manifest = json.load(fh)
          ann = manifest.get("annotations") or {}
          print(json.dumps(ann, indent=2))
          required = [
              "org.opencontainers.image.created",
              "org.opencontainers.image.version",
              "org.opencontainers.image.revision",
              "org.opencontainers.image.source",
              "org.opencontainers.image.title",
              "org.opencontainers.image.licenses",
              "vnd.custos.build.tag",
              "vnd.custos.build.actor",
              "vnd.custos.build.agent",
              "vnd.custos.build.run-id",
              "vnd.custos.build.run-url",
          ]
          missing = [k for k in required if k not in ann]
          if missing:
              raise SystemExit(f"manifest missing required annotations: {missing}")
          print("all required manifest annotations present")
          PY

      - name: Generate SBOM and keyless-sign
        uses: ./.github/actions/sbom-sign
        with:
          # Sign by digest so the signature/attestations bind to the immutable
          # manifest and cover every tag that points at it.
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          subject-name: ${{ matrix.title }}

      - name: Attach SLSA provenance
        uses: ./.github/actions/slsa-provenance
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          # build-images.yml is also invoked via workflow_call (release +
          # offline bundle); pass an explicit builder id so its provenance
          # identity stays build-images.yml regardless of the entry workflow.
          builder-id: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-images.yml@${{ github.ref }}

  # Aggregate the built image references so ``workflow_call`` consumers (release
  # + offline bundle) can fan out from a single output.
  collect:
    name: Collect image references
    needs: [setup, build]
    # Always run so ``workflow_call`` consumers get a stable JSON output even
    # when nothing was built (the output defaults to ``[]``).
    if: always()
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Assemble image list
        id: collect
        env:
          MATRIX: ${{ needs.setup.outputs.matrix }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Return fully-qualified, immutable ``:sha-...`` references (the same
          # tag every build always pushes) so downstream jobs can consume them
          # directly. Defaults to ``[]`` when no image was built.
          SHA_TAG="sha-$(git rev-parse HEAD | cut -c1-12)"
          export SHA_TAG
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          matrix = json.loads(os.environ["MATRIX"])["include"]
          owner = os.environ["OWNER"]
          sha_tag = os.environ["SHA_TAG"]
          images = [f"ghcr.io/{owner}/{e['image']}:{sha_tag}" for e in matrix]
          print("images=" + json.dumps(images))
          PY
