name: python-libs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"
  push:
    branches: [main]
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"

permissions:
  contents: read

jobs:
  storage-provider-layer:
    name: storage-provider-layer (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/libs/storage-provider-layer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q

  custos-cel:
    name: custos-cel (lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: src/libs/custos-cel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (with 90% coverage gate)
        run: pytest -q --cov=custos_cel --cov-report=term-missing --cov-fail-under=90

  integration-tests:
    name: Adapter Conformance Tests (integration)
    runs-on: ubuntu-latest
    needs: storage-provider-layer
    if: |
      always() &&
      (needs.storage-provider-layer.result == 'success' || needs.storage-provider-layer.result == 'skipped')
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: custos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      loki:
        image: grafana/loki:latest
        options: >-
          --health-cmd "curl -f http://localhost:3100/-/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3100:3100

      prometheus:
        image: prom/prometheus:latest
        options: >-
          --health-cmd "curl -f http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPL and adapters
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-csi[dev]
          pip install -e src/libs/custos-loki[dev]
          pip install -e src/libs/custos-postgres[dev]
          pip install -e src/libs/custos-prometheus[dev]
          pip install -e src/libs/custos-s3[dev]

      - name: Wait for services to be ready
        run: sleep 10

      - name: Run conformance tests
        run: |
          pytest \
            src/libs/custos-csi/tests/test_conformance.py \
            src/libs/custos-loki/tests/test_conformance.py \
            src/libs/custos-postgres/tests/test_conformance.py \
            src/libs/custos-prometheus/tests/test_conformance.py \
            src/libs/custos-s3/tests/test_conformance.py \
            -v -m integration --tb=short
        env:
          CUSTOS_PG_DSN: postgresql://testuser:testpass@localhost:5432/custos_test
          CUSTOS_LOKI_URL: http://localhost:3100
          CUSTOS_PROMETHEUS_URL: http://localhost:9090
