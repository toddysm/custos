name: python-libs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"
  push:
    branches: [main]
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"

jobs:
  storage-provider-layer:
    name: storage-provider-layer (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/libs/storage-provider-layer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q
