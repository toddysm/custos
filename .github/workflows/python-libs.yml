name: python-libs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"
      - ".github/prometheus.yml"
  push:
    branches: [main]
    paths:
      - "src/libs/**"
      - ".github/workflows/python-libs.yml"
      - ".github/prometheus.yml"

jobs:
  storage-provider-layer:
    name: storage-provider-layer (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/libs/storage-provider-layer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q

  custos-cel:
    name: custos-cel (lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: src/libs/custos-cel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (with 90% coverage gate)
        run: pytest -q --cov=custos_cel --cov-report=term-missing --cov-fail-under=90 --hypothesis-seed=0

  integration-tests:
    name: Adapter Conformance Tests (integration)
    runs-on: ubuntu-latest
    needs: storage-provider-layer
    if: |
      always() &&
      (needs.storage-provider-layer.result == 'success' || needs.storage-provider-layer.result == 'skipped')
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: custos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      loki:
        image: grafana/loki:latest
        ports:
          - 3100:3100

      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPL and adapters
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-csi[dev]
          pip install -e src/libs/custos-loki[dev]
          pip install -e src/libs/custos-postgres[dev]
          pip install -e src/libs/custos-prometheus[dev]
          pip install -e src/libs/custos-s3[dev]

      - name: Configure conformance metric labels
        env:
          PROMETHEUS_CONTAINER: ${{ job.services.prometheus.id }}
        run: |
          docker cp .github/prometheus.yml "$PROMETHEUS_CONTAINER:/etc/prometheus/prometheus.yml"
          docker kill --signal=HUP "$PROMETHEUS_CONTAINER"

      - name: Wait for backend readiness and test metrics
        shell: bash
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:3100/ready
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:9090/-/ready
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --get \
              --data-urlencode 'query=up{workspace_id="ws-conformance-test-primary"}' \
              http://localhost:9090/api/v1/query |
              python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data["status"] == "success" and data["data"]["result"] else 1)'; then
              exit 0
            fi
            sleep 2
          done
          echo "Prometheus did not expose the configured conformance metric" >&2
          exit 1

      - name: Run conformance tests
        shell: bash
        run: |
          for adapter in custos-csi custos-loki custos-postgres custos-prometheus custos-s3; do
            (
              cd "src/libs/$adapter"
              case "$adapter" in
                custos-csi)
                  pytest tests/test_conformance.py tests/test_metadata.py tests/test_unit.py -v --tb=short
                  ;;
                custos-loki|custos-prometheus)
                  pytest tests/test_conformance.py tests/test_conformance_regressions.py tests/test_unit.py -v --tb=short
                  ;;
                *)
                  pytest tests/test_conformance.py -v -m integration --tb=short
                  ;;
              esac
            )
          done
        env:
          CUSTOS_PG_DSN: postgresql://testuser:testpass@localhost:5432/custos_test
          CUSTOS_LOKI_URL: http://localhost:3100
          CUSTOS_PROMETHEUS_URL: http://localhost:9090
