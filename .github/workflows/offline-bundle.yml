name: offline-bundle

# Air-gapped offline install bundle (DEPLOY-IMPL-016).
#
# On a version tag this rebuilds + pushes the Custos images through the reusable
# build-images workflow (so the bundle ships the exact same signed images a
# connected install would pull), then assembles
# ``custos-<version>-airgapped.tar.gz`` (vendored chart + ``docker save`` image
# archives + connectors-core + checksums + runbook) and attaches it to the
# GitHub release. A manual ``workflow_dispatch`` run publishes the bundle as a
# workflow artifact instead of a release asset.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to bundle (defaults to the triggering ref)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Reuse the exact build/annotate/sign path so the bundled images match a
  # connected install. Outputs the built image references (unused here — the
  # bundle re-derives them from images.txt — but kept for traceability).
  images:
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ inputs.ref || github.ref }}

  bundle:
    name: Assemble offline bundle
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the tarball to the release on a tag
      packages: read # pull the freshly pushed Custos images
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v*.*.* ]]; then
            VERSION="${REF#refs/tags/v}"
            CUSTOS_TAG="${REF#refs/tags/}"
          else
            VERSION="$(git rev-parse --short HEAD)"
            CUSTOS_TAG="sha-$(git rev-parse HEAD | cut -c1-12)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "custos_tag=$CUSTOS_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bundle pulls dozens of upstream images, many from Docker Hub. An
      # authenticated pull avoids the anonymous rate limit that otherwise makes
      # tag builds flaky. Skipped automatically when the credentials are unset.
      - name: Login to Docker Hub (optional)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build offline bundle
        env:
          BUNDLE_VERSION: ${{ steps.ver.outputs.version }}
          CUSTOS_IMAGE_TAG: ${{ steps.ver.outputs.custos_tag }}
        run: |
          make -C deploy/offline bundle \
            VERSION="$BUNDLE_VERSION" \
            CUSTOS_IMAGE_TAG="$CUSTOS_IMAGE_TAG"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: custos-${{ steps.ver.outputs.version }}-airgapped
          path: deploy/offline/custos-${{ steps.ver.outputs.version }}-airgapped.tar.gz
          if-no-files-found: error

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # The release-tag pipeline owns the GitHub Release: create it (with
          # auto-generated notes) the first time, then attach the bundle. Without
          # this, `gh release upload` fails with "release not found" because no
          # Release exists for the tag yet.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "deploy/offline/custos-${BUNDLE_VERSION}-airgapped.tar.gz" \
            --clobber
