      - name: Pytest (with 90% coverage gate)
        run: pytest -q --cov=custos_arm --cov-report=term-missing --cov-fail-under=90

  activity-runtime-manager-integration:
    name: activity-runtime-manager (kind integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/activity-runtime-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Stand up a throwaway single-node Kubernetes cluster. The OCI Container
      # Driver lifecycle monitor (ARM-IMPL-016) is exercised end-to-end against
      # it: prepare -> start -> await_terminal -> collect -> cleanup, plus
      # image-pull-failure detection and idempotent cancel/cleanup.
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: custos-arm

      # A tiny non-root image (USER 65532, ENTRYPOINT /bin/true) so the
      # hardened security context (runAsNonRoot, readOnlyRootFilesystem) is
      # satisfied without writing to the root filesystem or pulling from a
      # registry. Loaded straight into the kind node (imagePullPolicy is
      # IfNotPresent, so no pull is attempted).
      - name: Build and load the e2e activity image
        run: |
          cat > /tmp/Dockerfile.e2e <<'EOF'
          FROM busybox:1.36
          USER 65532
          ENTRYPOINT ["/bin/true"]
          EOF
          docker build -t custos-arm-e2e:test -f /tmp/Dockerfile.e2e /tmp
          kind load docker-image custos-arm-e2e:test --name custos-arm

      - name: Install custos-callctx library from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/custos-callctx[dev]

      - name: Install custos-spl library from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Pytest (integration suite against kind)
        env:
          CUSTOS_ARM_E2E_IMAGE: custos-arm-e2e:test
        run: pytest -q -m integration --no-cov

