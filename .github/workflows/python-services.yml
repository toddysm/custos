      - name: Pytest (integration, Postgres only)
        env:
          CUSTOS_PG_DSN: postgresql://testuser:testpass@localhost:5432/custos_connector_test
        run: pytest tests/integration -v -m "integration and not oci_integration" --tb=short --no-cov

  connector-service-oci-integration:
    name: connector-service (integration vs OCI registries)
    runs-on: ubuntu-latest
    needs: connector-service
    if: |
      always() &&
      (needs.connector-service.result == 'success' || needs.connector-service.result == 'skipped')
    defaults:
      run:
        working-directory: src/services/connector-service
    services:
      distribution:
        # CNCF distribution reference (registry:2). The released default
        # configuration does NOT expose the OCI Referrers API at
        # /v2/<name>/referrers/<digest> (verified through v2.8.x and
        # v3.1.1), so the integration suite exercises distribution only
        # against the connector-specific fallback-tag path. The
        # Referrers code path is covered against zot below.
        image: registry:2.8.3
        ports:
          - 5000:5000
      zot:
        # Project Zot. Default config listens on :5000 with Referrers support.
        image: ghcr.io/project-zot/zot-linux-amd64:v2.1.2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPL + Postgres adapter + call-context lib from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-postgres[dev]
          pip install -e src/libs/custos-callctx[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Wait for registries to be ready
        run: |
          for url in http://localhost:5000/v2/ http://localhost:5001/v2/; do
            ready=false
            for _ in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$url is ready"
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" != true ]; then
              echo "Registry did not become ready after retries: $url" >&2
              exit 1
            fi
          done

      - name: Pytest (OCI integration)
        env:
          CUSTOS_OCI_REGISTRY_DISTRIBUTION_URL: http://localhost:5000
          CUSTOS_OCI_REGISTRY_ZOT_URL: http://localhost:5001
        run: pytest tests/integration -v -m oci_integration --tb=short --no-cov

  connector-sidecar:
    name: connector-sidecar (lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: src/services/connector-sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        # The sidecar has zero in-repo deps (no SPL / custos-postgres);
        # it talks to Connector Service over HTTP. Only the package
        # itself + its [dev] extra are needed.
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (unit)
        run: pytest -q

  connector-sidecar-integration:
    name: connector-sidecar (mTLS + E2E integration)
    runs-on: ubuntu-latest
    needs: connector-sidecar
    if: |
      always() &&
      (needs.connector-sidecar.result == 'success' || needs.connector-sidecar.result == 'skipped')
    defaults:
      run:
        working-directory: src/services/connector-sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Pytest (integration — mTLS + E2E)
        # Runs ``test_mtls_integration.py`` and ``test_e2e.py``. The
        # E2E harness spins up the production sidecar wiring + a fake
        # Connector Service in-process; no external services needed.
        run: pytest tests -v -m integration --tb=short --no-cov

  connector-sidecar-image:
    name: connector-sidecar (image build + push)
    runs-on: ubuntu-latest
    needs: [connector-sidecar, connector-sidecar-integration]
    if: |
      always() &&
      needs.connector-sidecar.result == 'success' &&
      needs.connector-sidecar-integration.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}/connector-sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Skip login on pull_request events; ``GITHUB_TOKEN`` from a
        # forked PR cannot write packages. The build step below also
        # sets ``push: false`` for PRs.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # Build the comma-separated tag list for build-push-action.
        # On main: ``<image>:dev`` + ``<image>:sha-<commit>``. On PRs:
        # only the immutable ``:sha-<commit>`` tag (used to keep
        # ``docker tag`` semantics consistent across build runs).
        run: |
          set -euo pipefail
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${IMAGE}:dev,${SHA_TAG}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and (conditionally) push image
        uses: docker/build-push-action@v6
        with:
          context: src/services/connector-sidecar
          file: src/services/connector-sidecar/Dockerfile
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          # Layer cache via the GitHub Actions cache backend so PRs
          # share the builder layer across runs.
          cache-from: type=gha,scope=connector-sidecar
          cache-to: type=gha,mode=max,scope=connector-sidecar
          # Pin platforms explicitly. We ship linux/amd64 only for
          # now; ARM follows when the runtime story is locked.
          platforms: linux/amd64

  connector-plugins:
    name: connector-plugins (lint + types + tests + docker build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each reference plugin lives under src/libs/connector-plugins/<plugin>
        # and is self-contained (its own pyproject + Dockerfile + tests).
        # Matrix-parallelise so a regression in one plugin doesn't mask
        # the other. ``package`` is the importable name (``-`` -> ``_`` +
        # ``_plugin`` suffix) we hand to mypy so it can analyze the
        # installed package alongside the test sources without
        # double-discovering the in-tree ``src/`` layout.
        include:
          - plugin: oci-registry
            package: oci_registry_plugin
            python-version: "3.11"
          - plugin: oci-registry
            package: oci_registry_plugin
            python-version: "3.12"
          - plugin: slack-notifier
            package: slack_notifier_plugin
            python-version: "3.11"
          - plugin: slack-notifier
            package: slack_notifier_plugin
            python-version: "3.12"
    defaults:
      run:
        working-directory: src/libs/connector-plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        # Two invocations so we don't mix mypy's mutually-exclusive
        # ``-p <package>`` and positional-files modes. Passing ``src``
        # AND having the package installed in the venv (editable) would
        # otherwise make mypy discover the same source files twice
        # (under ``src.<package>`` and ``<package>``) and abort with
        # "Source file found twice under different module names".
        run: |
          mypy -p ${{ matrix.package }}
          mypy tests

      - name: Pytest (unit)
        run: pytest -q

      - name: Set up Docker Buildx
        # Only build the image on one Python version to keep CI fast;
        # the Dockerfile pins its own ``python:3.12-slim`` base.
        if: matrix.python-version == '3.12'
        uses: docker/setup-buildx-action@v3

      - name: Build plugin image (no push)
        if: matrix.python-version == '3.12'
        uses: docker/build-push-action@v6
        with:
          context: src/libs/connector-plugins/${{ matrix.plugin }}
          file: src/libs/connector-plugins/${{ matrix.plugin }}/Dockerfile
          push: false
          tags: custos-plugin-${{ matrix.plugin }}:ci
          cache-from: type=gha,scope=connector-plugin-${{ matrix.plugin }}
          cache-to: type=gha,mode=max,scope=connector-plugin-${{ matrix.plugin }}
          platforms: linux/amd64
