name: python-services

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/services/**"
      - ".github/workflows/python-services.yml"
  push:
    branches: [main]
    paths:
      - "src/services/**"
      - ".github/workflows/python-services.yml"

jobs:
  catalog-service:
    name: catalog-service (lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: src/services/catalog-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SPL + Postgres adapter + CEL library from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-postgres[dev]
          pip install -e src/libs/custos-cel[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (with 90% coverage gate)
        run: pytest -q --cov=custos_catalog --cov-report=term-missing --cov-fail-under=90

  catalog-service-integration:
    name: catalog-service (integration vs Postgres)
    runs-on: ubuntu-latest
    needs: catalog-service
    if: |
      always() &&
      (needs.catalog-service.result == 'success' || needs.catalog-service.result == 'skipped')
    defaults:
      run:
        working-directory: src/services/catalog-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: custos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPL + Postgres adapter + CEL library from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-postgres[dev]
          pip install -e src/libs/custos-cel[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Postgres
        run: sleep 10

      - name: Pytest (integration)
        env:
          CUSTOS_PG_DSN: postgresql://testuser:testpass@localhost:5432/custos_test
        run: pytest tests/integration -v -m integration --tb=short --no-cov

  auth-service:
    name: auth-service (lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: src/services/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SPL + Postgres adapter from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-postgres[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (with 90% coverage gate)
        run: pytest -q --cov=custos_auth --cov-report=term-missing --cov-fail-under=90

  auth-service-integration:
    name: auth-service (integration vs Postgres)
    runs-on: ubuntu-latest
    needs: auth-service
    if: |
      always() &&
      (needs.auth-service.result == 'success' || needs.auth-service.result == 'skipped')
    defaults:
      run:
        working-directory: src/services/auth-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: custos_auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPL + Postgres adapter from path
        working-directory: ${{ github.workspace }}
        run: |
          pip install -e src/libs/storage-provider-layer[dev]
          pip install -e src/libs/custos-postgres[dev]

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Postgres
        run: sleep 10

      - name: Pytest (integration)
        env:
          CUSTOS_AUTH_PG_DSN: postgresql://testuser:testpass@localhost:5432/custos_auth_test
        run: pytest tests/integration -v -m integration --tb=short --no-cov
