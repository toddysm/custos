name: helm-release

# Package + publish the umbrella Helm chart as a signed OCI artifact
# (DEPLOY-IMPL-017).
#
# On a ``v*.*.*`` tag the chart ``version`` + ``appVersion`` are aligned to the
# tag (so the published chart tracks the image tag), the chart — with every
# dependency subchart vendored — is ``helm push``ed to
# ``ghcr.io/<owner>/custos/charts/custos``, and the pushed artifact is
# keyless-signed with cosign under the same policy as the container images
# (Fulcio short-lived cert + Rekor transparency log via the ambient GitHub OIDC
# token). A manual ``workflow_dispatch`` on a tag ref re-runs the same path.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ref to package (must be a v*.*.* tag)."
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CHART_OCI_REPO: ghcr.io/${{ github.repository_owner }}/custos/charts

jobs:
  release:
    name: Package + publish chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing via the ambient GitHub OIDC token (Fulcio).
      id-token: write
    steps:
      # Validate the ref BEFORE checkout so a manual dispatch can only ever
      # package/publish from a real release tag (the checkout ref is taken from
      # this step's validated output, never the raw input).
      - name: Resolve version
        id: ver
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          # Strict vX.Y.Z tags only — reject branches, arbitrary refs, and
          # pre-release/build-metadata tags (e.g. v1.2.3-rc1) so the published
          # OCI artifact can only originate from a real release tag.
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::helm-release requires a strict vX.Y.Z tag ref (got: $REF)" >&2
            exit 1
          fi
          # The chart version is strict SemVer (no leading ``v``); the
          # appVersion keeps the leading ``v`` so it matches the release image
          # tag (which is vX.Y.Z — see build-images.yml).
          echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "app_version=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Vendor chart dependencies
        run: cd deploy/helm/custos && helm dependency update

      # cosign uses the docker / go-containerregistry keychain
      # (~/.docker/config.json), NOT Helm's own registry credential store, so it
      # needs its own GHCR login or the signature push fails with
      # ``UNAUTHORIZED: unauthenticated``.
      - name: Log in to GHCR (cosign / OCI keychain)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GHCR_USER" --password-stdin

      - name: Package + push chart
        id: push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # --version (SemVer) / --app-version (vX.Y.Z, matching the image tag)
          # stamp the packaged Chart.yaml so the published artifact is
          # consistent with the release.
          helm package deploy/helm/custos \
            --version "$VERSION" --app-version "$APP_VERSION" --destination dist
          OUT="$(helm push "dist/custos-${VERSION}.tgz" "oci://${CHART_OCI_REPO}" 2>&1 | tee /dev/stderr)"
          DIGEST="$(echo "$OUT" | awk '/[Dd]igest:/ {print $2}')"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::could not parse pushed chart digest" >&2
            exit 1
          fi
          echo "ref=${CHART_OCI_REPO}/custos@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Keyless-sign the chart artifact
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$CHART_REF"

      - name: Verify the published chart pulls
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # helm pull writes to <destination>/<name>.tgz, but the destination
          # directory must already exist or the underlying temp-file rename
          # fails with "no such file or directory".
          mkdir -p /tmp/pull
          helm pull "oci://${CHART_OCI_REPO}/custos" --version "$VERSION" --destination /tmp/pull
          test -f "/tmp/pull/custos-${VERSION}.tgz"
          echo "Pulled custos-${VERSION}.tgz from oci://${CHART_OCI_REPO}/custos"
