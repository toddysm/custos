[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-workflow-service"
version = "0.1.0"
description = "Custos Workflow Service (COMP-003) — Run / Step / StepAttempt orchestration over Dapr Workflow, Definition Compiler, Expression Evaluator integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "workflow", "dapr", "orchestration", "service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Runtime surfaces are pulled in incrementally across the WF-IMPL-* phases
# tracked by the WF-IMPL-000-COMPILER tracker (#363). Path-installed locally
# and in CI from `src/libs/` via the same install order documented in
# `.github/workflows/python-services.yml`:
#
#   pip install -e src/libs/custos-cel[dev]
#   pip install -e src/services/workflow-service[dev]
#
# `custos-cel` provides the sandboxed CEL parser, type checker, and
# evaluator that the Definition Compiler (WF-IMPL-016 .. WF-IMPL-021) and
# every later sub-module consume. WF-IMPL-015 wires the FastAPI surface
# end-to-end through the `/healthz` and `/readyz` routes.
dependencies = [
    "custos-cel",
    "custos-spl",
    # custos-postgres provides the asyncpg-backed MetadataStoreProvider
    # adapter (custos_pg.PgMetadataAdapter) the WF-IMPL-115 durable
    # metadata store wires from WF_METADATA_STORE. The import is confined
    # to custos_workflow.providers.MetadataStorePool.open (lazy) so the
    # in-memory dev / test path never pulls in asyncpg.
    "custos-postgres",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.20,<2",
    # Dapr Workflow Python SDK — required by custos_workflow.runtime
    # (WF-IMPL-029, #381). All imports of dapr.ext.workflow are
    # confined to custos_workflow.runtime.dapr so the rest of the
    # service can be exercised under FakeWorkflowRuntime / -Client
    # without a live sidecar.
    "dapr-ext-workflow>=1.17,<2",
    # httpx — used by custos_workflow.runs.events.DaprPubSubLifecyclePublisher
    # (WF-IMPL-041, #393) to POST envelopes against the Dapr sidecar's
    # /v1.0/publish/{pubsub}/{topic} HTTP API. Same pattern as
    # custos-connector's DaprPubSubEventPublisher (no Dapr SDK runtime
    # dependency beyond dapr-ext-workflow).
    "httpx>=0.27",
    # jsonschema — used by custos_workflow.validator.inputs
    # (WF-IMPL-063, #449) to evaluate the StartRun ``inputs`` payload
    # against the JSON Schema derived from ``WorkflowSpec.inputs``.
    # Draft 2020-12 validator is the default; failures are translated
    # into structured :class:`InputsSchemaError` rejections with a
    # JSON-pointer ``loc`` per failure.
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Stubs for the runtime jsonschema dependency added in WF-IMPL-063
    # for inputs JSON-Schema validation. The matching upstream version
    # (4.21+) is pinned in `dependencies` above.
    "types-jsonschema>=4.21",
    # OTel SDK is dev-only so tests can install in-memory exporters when
    # WF-IMPL-027 lands. The library itself only depends on the API.
    "opentelemetry-sdk>=1.20,<2",
    # Property-based determinism tests (WF-IMPL-026) use Hypothesis.
    "hypothesis>=6.100",
    # asyncpg is pulled in transitively by custos-postgres for the
    # WF-IMPL-115 durable metadata store; pin it in dev so the lazy
    # MetadataStorePool import resolves in unit tests that patch it.
    "asyncpg>=0.29",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/workflow-service/design.md"

[project.scripts]
custos-workflow-service = "custos_workflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_workflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `Depends(...)` in default arguments, which is the
# documented FastAPI idiom; B008 fires on every such call. B011 covers
# `assert ... is None` patterns used in fixture wiring.
"tests/**" = ["B008", "B011"]
# API routers + dependency factories rely on the documented FastAPI
# `Depends(...)` / `Path(...)` / `Query(...)` idiom in argument defaults;
# B008 fires on every such default value (Annotated[..., Depends(...)]
# avoids B008 but mypy strict then loses some flow analysis).
"src/custos_workflow/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../../libs/custos-cel/src:../../libs/storage-provider-layer/src:../../libs/custos-postgres/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# asyncpg ships no PEP 561 marker; treat as untyped at the boundary.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=custos_workflow",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["custos_workflow"]
omit = [
    "src/custos_workflow/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@overload",
]
