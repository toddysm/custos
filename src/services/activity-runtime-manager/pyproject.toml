[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-activity-runtime-manager"
version = "0.1.0"
description = "Custos Activity Runtime Manager (COMP-006) — schedules, isolates, and runs workflow activities as OCI containers with brokered I/O, secrets, and result mapping."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "activity", "runtime", "dapr", "oci", "service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Runtime surfaces are pulled in incrementally across the ARM-IMPL-* phases
# tracked by the ARM-IMPL-000-ACTIVITY-RUNTIME-MANAGER tracker (#591).
# Path-installed locally and in CI from `src/libs/` in the same order
# documented in `.github/workflows/python-services.yml`:
#
#   pip install -e src/libs/custos-callctx[dev]
#   pip install -e src/libs/storage-provider-layer[dev]
#   pip install -e src/services/activity-runtime-manager[dev]
#
# `custos-spl` (storage-provider-layer) provides the Artifact Store and
# Metadata Store provider Protocols the Artifact Store Client (ARM-IMPL-006)
# and ActivityExecution store (ARM-IMPL-005) consume; `custos-callctx`
# provides the call-context model + middleware the AuthZ dev-shim
# (ARM-IMPL-002) wires in. ARM-IMPL-001 wires the FastAPI surface
# end-to-end through the `/healthz` and `/readyz` routes.
dependencies = [
    "custos-callctx",
    "custos-spl",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # OTel SDK is dev-only so tests can install in-memory exporters when
    # observability (ARM-IMPL-020) lands. The library only depends on the API.
    "opentelemetry-sdk>=1.20,<2",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/activity-runtime-manager/design.md"

[project.scripts]
custos-activity-runtime-manager = "custos_arm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_arm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `Depends(...)` in default arguments, which is the
# documented FastAPI idiom; B008 fires on every such call. B011 covers
# `assert ... is None` patterns used in fixture wiring.
"tests/**" = ["B008", "B011"]
# API routers + dependency factories rely on the documented FastAPI
# `Depends(...)` idiom in argument defaults; B008 fires on every such
# default value.
"src/custos_arm/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../../libs/storage-provider-layer/src:../../libs/custos-callctx/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=custos_arm",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that wire real collaborators (kind/k8s).",
]

[tool.coverage.run]
branch = false
source = ["custos_arm"]
omit = [
    "src/custos_arm/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@overload",
]
