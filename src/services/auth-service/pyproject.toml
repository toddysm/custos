[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-auth-service"
version = "0.1.0"
description = "Custos Auth Service (COMP-002) — identity issuance, identity verification, authorization decisions, and the internal signed call-context contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "auth", "rbac", "oidc", "service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Runtime surfaces are pulled in incrementally across the AS-IMPL-* phases.
# Phase B (AS-IMPL-003 + AS-IMPL-004) added `custos-spl` + `custos-postgres`
# for the `AuthStoreProvider` + `MetadataStoreProvider` adapters and the
# schema-revision startup gate. The matching path-install steps live in
# `.github/workflows/python-services.yml` (mirroring catalog-service).
# AS-IMPL-017 will add a JWT library (proposed `python-jose[cryptography]`
# or `authlib`) for the EdDSA call-context signer; AS-IMPL-020 will add
# OIDC verification deps.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "opentelemetry-api>=1.20,<2",
    "custos-spl",
    "custos-postgres",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "opentelemetry-sdk>=1.20,<2",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/auth-service/design.md"

[project.scripts]
custos-auth-service = "custos_auth.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_auth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `Depends(...)` in default arguments, which is the
# documented FastAPI idiom; B008 fires on every such call. B011 covers
# `assert ... is None` patterns used in fixture wiring.
"tests/**" = ["B008", "B011"]
# The API surface uses the documented FastAPI `Depends(...)` / `Body(...)` /
# `Path(...)` / `Query(...)` idiom in argument defaults; B008 fires on every
# such call. There is no clean way to express these without the call in the
# default value (Annotated[..., Depends(...)] avoids B008 but mypy strict
# rejects the pattern with our protocols), so we narrow the ignore to the
# api package.
"src/custos_auth/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../../libs/storage-provider-layer/src:../../libs/custos-postgres/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres backend (testcontainers / CI service)",
]

[tool.coverage.run]
branch = false
source = ["custos_auth"]
omit = [
    "src/custos_auth/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@overload",
]
