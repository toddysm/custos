[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-catalog-service"
version = "0.1.0"
description = "Custos Catalog Service (COMP-007) — workflow + template definitions, activity/connector catalog index, publish-time validation gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "catalog", "workflow", "template", "service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# All non-stdlib dependencies are reached in later CS-IMPL-* issues. The
# scaffold itself only imports stdlib; CI installs `[dev]` to exercise the
# lint/type/test toolchain. The runtime extras here pin the surfaces every
# downstream issue will pull in (custos-spl + custos-postgres for CS-IMPL-003,
# custos-cel for CS-IMPL-007, FastAPI/uvicorn for CS-IMPL-017, pydantic for
# typed request/response models throughout). Path-installed locally via the
# `[tool.hatch.metadata]` allow-direct-references switch below; CI mirrors
# the same install order in `python-services.yml`.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # OTel SDK is dev-only so tests can install in-memory exporters when
    # CS-IMPL-019 lands. The library itself only depends on the API.
    "opentelemetry-sdk>=1.20,<2",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/catalog-service/design.md"

[project.scripts]
custos-catalog-service = "custos_catalog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_catalog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
