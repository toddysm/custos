[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-catalog-service"
version = "0.1.0"
description = "Custos Catalog Service (COMP-007) — workflow + template definitions, activity/connector catalog index, publish-time validation gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "catalog", "workflow", "template", "service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Runtime surfaces are pulled in incrementally across the CS-IMPL-* phases.
# Path-installed locally and in CI from `src/libs/` via the same install
# order in `.github/workflows/python-services.yml`:
#
#   pip install -e src/libs/storage-provider-layer[dev]
#   pip install -e src/libs/custos-postgres[dev]
#   pip install -e src/services/catalog-service[dev]
#
# `custos-spl` provides the `DefinitionStoreProvider` /
# `CatalogStoreProvider` Protocols + `MigrationRequired`; `custos-postgres`
# provides the v1 Postgres adapter classes. CS-IMPL-005 pulls in
# `jsonschema` for the publish-time workflow/template schema gate;
# CS-IMPL-007 pulls in `custos-cel` for the CEL syntactic +
# name-binding gate. CS-IMPL-017 will exercise the FastAPI/uvicorn
# surface end-to-end through real routes.
dependencies = [
    "custos-spl",
    "custos-postgres",
    "custos-cel",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "opentelemetry-api>=1.20,<2",
    # Runtime dependency: clients/connector.py imports httpx at module load
    # for the ValidateConnector internal RPC. Must ship in the service image,
    # not just the dev extra.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    # OTel SDK is dev-only so tests can install in-memory exporters when
    # CS-IMPL-019 lands. The library itself only depends on the API.
    "opentelemetry-sdk>=1.20,<2",
    # Integration tests (CS-IMPL-021) need testcontainers to spin up
    # Postgres locally when ``CUSTOS_PG_DSN`` is not provided.
    "testcontainers[postgres]>=4.0",
    "asyncpg>=0.29",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/catalog-service/design.md"

[project.scripts]
custos-catalog-service = "custos_catalog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_catalog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `Depends(...)` in default arguments, which is the
# documented FastAPI idiom; B008 fires on every such call. B011 covers
# `assert ... is None` patterns used in fixture wiring.
"tests/**" = ["B008", "B011"]
# The API surface uses the documented FastAPI `Depends(...)` / `Body(...)` /
# `Path(...)` / `Query(...)` idiom in argument defaults; B008 fires on every
# such call. There is no clean way to express these without the call in the
# default value (Annotated[..., Depends(...)] avoids B008 but mypy strict
# rejects the pattern with our protocols), so we narrow the ignore to the
# api package.
"src/custos_catalog/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../../libs/storage-provider-layer/src:../../libs/custos-postgres/src:../../libs/custos-cel/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# asyncpg ships no PEP 561 marker; treat as untyped at the boundary.
module = ["asyncpg", "asyncpg.*", "testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres backend (testcontainers / CI service)",
]

[tool.coverage.run]
branch = false
source = ["custos_catalog"]
omit = [
    "src/custos_catalog/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@overload",
]
