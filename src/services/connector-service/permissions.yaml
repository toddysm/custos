# Permissions registry shipped by the Connector Service (COMP-007).
#
# The auth-service permission-registry loader
# (``custos_auth.permission_registry``) ingests this file when
# ``CUSTOS_AUTH_PERMISSIONS_PATHS`` points at it, upserting each row into the
# SPL ``Permission`` table. These are the connector-instance permissions the
# API Gateway route table requires (the gateway is the canonical owner of the
# route→permission mapping).
#
# Each entry carries:
# * ``name``        — canonical permission identifier the call-context and
#                     authorize engine consume.
# * ``description`` — operator-facing human description.
# * ``declaredBy``  — pipe-delimited list of components that ship the
#                     permission.

permissions:
  - name: connector:read
    description: |
      List connectors and read connector metadata, health, leases, and
      cursor state for a workspace.
    declaredBy: connector-service
  - name: admin:connector
    description: |
      Register, update, enable/disable, and remove connectors in a
      workspace (including lease and pull-loop administration).
    declaredBy: connector-service
