[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-connector-service"
version = "0.1.0"
description = "Custos Connector Service (COMP-005) — connector type registry, connector instance lifecycle, capability matching, context issuance, and trigger listen streams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "connector", "service", "oci", "secrets", "leases"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Runtime surfaces are pulled in incrementally across the CONN-IMPL-* phases.
# Path-installed locally and in CI from `src/libs/` via the same install
# order in `.github/workflows/python-services.yml`:
#
#   pip install -e src/libs/storage-provider-layer[dev]
#   pip install -e src/libs/custos-postgres[dev]
#   pip install -e src/libs/custos-callctx[dev]
#   pip install -e src/services/connector-service[dev]
#
# `custos-spl` provides the `CatalogStoreProvider` /
# `MetadataStoreProvider` Protocols + `MigrationRequired`; `custos-postgres`
# provides the v1 Postgres adapters. `custos-callctx` provides the
# inbound call-context verifier middleware (CONN-IMPL-004). CONN-IMPL-005
# pulls in `jsonschema` for the ConnectorManifest v1 publish-time gate;
# CONN-IMPL-007 uses `httpx` for the OCI Referrers API client; CONN-IMPL-026
# exercises the FastAPI / uvicorn surface end-to-end through real routes.
dependencies = [
    "custos-spl",
    "custos-postgres",
    "custos-callctx",
    "fastapi>=0.110,<0.137",  # pin <0.137: 0.137 made include_router lazy (_IncludedRouter), breaking app.routes introspection
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.20,<2",
    # CONN-IMPL-029 (Phase K) — the connector-service exposes its own
    # ``/metrics`` endpoint per the issue acceptance criteria. The SDK
    # configures a process-local ``MeterProvider`` + ``TracerProvider``
    # on first :func:`custos_connector.create_app` call; the Prometheus
    # exporter registers the resulting metrics with the global
    # ``prometheus_client`` registry that backs the ``/metrics`` ASGI
    # app. Production deployments keep the Helm-managed Collector
    # sidecar for OTLP export of spans; the in-process Prometheus
    # exporter only feeds the local scrape endpoint.
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-prometheus>=0.41b0",
    # OTLP trace exporter — required so spans actually leave the
    # process and reach the Helm-managed Collector sidecar when
    # ``OTEL_EXPORTER_OTLP_*`` env vars are set. Without this package
    # the ``_runtime._maybe_build_otlp_span_processor`` helper logs a
    # warning and drops spans. Pinned to the same minor as the SDK to
    # avoid a partial-bump producing protocol drift between the
    # exporter wire format and the SDK's batch processor.
    "opentelemetry-exporter-otlp>=1.20,<2",
    "prometheus_client>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    # OTel SDK is also pulled in as a runtime dependency above for the
    # in-process ``/metrics`` endpoint (CONN-IMPL-029). Keeping it
    # listed under ``dev`` is redundant but harmless; tests use the
    # SDK's in-memory exporters to assert spans + metric samples.
    "opentelemetry-sdk>=1.20,<2",
    # Integration tests (CONN-IMPL-031) need testcontainers to spin up
    # Postgres locally when ``CUSTOS_PG_DSN`` is not provided.
    "testcontainers[postgres]>=4.0",
    "asyncpg>=0.29",
    # Property-based tests for the canonical normalizer (CONN-IMPL-006)
    # exercise the permutation-invariance + mutation-sensitivity
    # guarantees that ``compute_digest`` must satisfy.
    "hypothesis>=6.99",
    # OpenAPI snapshot validation (CONN-IMPL-026): the public REST
    # surface ships a committed ``openapi.json`` snapshot — the test
    # at ``tests/test_openapi_snapshot.py`` validates the generated
    # spec against the OpenAPI 3.1 schema and diffs against the
    # committed file.
    "openapi-spec-validator>=0.7",
    # OCI Referrers integration tests (CONN-IMPL-007) spin up a local
    # registry container when ``CUSTOS_OCI_REGISTRY_DISTRIBUTION_URL`` and
    # ``CUSTOS_OCI_REGISTRY_ZOT_URL`` are not provided.
    # We don't pull a registry-specific testcontainers extra because the
    # base ``DockerContainer`` is sufficient; the dep stays implicit.
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/connector-service/design.md"

[project.scripts]
custos-connector-service = "custos_connector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_connector"]
# The packaged ConnectorManifest v1 JSON Schema at
# ``src/custos_connector/manifest/_schemas/connector-manifest.v1.schema.json``
# ships with the wheel automatically (hatchling includes non-Python files
# in ``packages`` subtrees by default). ``importlib.resources`` resolves
# the file under ``custos_connector.manifest._schemas`` for both editable
# and wheel installs. The schema source-of-truth lives at
# ``design/components/connector-service/schemas/`` and is pinned
# bytes-equal to the packaged copy via
# ``tests/test_manifest_schema_drift.py``.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `Depends(...)` in default arguments, which is the
# documented FastAPI idiom; B008 fires on every such call. B011 covers
# `assert ... is None` patterns used in fixture wiring.
"tests/**" = ["B008", "B011"]
# The API surface uses the documented FastAPI `Depends(...)` / `Body(...)` /
# `Path(...)` / `Query(...)` idiom in argument defaults; B008 fires on every
# such call. There is no clean way to express these without the call in the
# default value (Annotated[..., Depends(...)] avoids B008 but mypy strict
# rejects the pattern with our protocols), so we narrow the ignore to the
# api package.
"src/custos_connector/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../../libs/storage-provider-layer/src:../../libs/custos-postgres/src:../../libs/custos-callctx/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# asyncpg ships no PEP 561 marker; treat as untyped at the boundary.
module = ["asyncpg", "asyncpg.*", "testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres backend (testcontainers / CI service)",
    "oci_integration: requires a live OCI registry (testcontainers / CI service; CONN-IMPL-007)",
]

[tool.coverage.run]
branch = false
source = ["custos_connector"]
omit = [
    "src/custos_connector/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@overload",
]
