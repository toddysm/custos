[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-cel"
version = "0.1.0"
description = "Custos sandboxed CEL-like expression evaluator — parser, type checker, and replay-deterministic runtime for workflow expressions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "workflow", "cel", "expression", "evaluator", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Chosen CEL parser/runtime (cloud-custodian/cel-python). Pinned tight
    # because the project is pre-1.0 (latest release on PyPI is 0.5.0,
    # 2026-01-31; 0.5.1 is on main but not yet published). We currently
    # only consume the parser surface (Environment.compile); the runtime
    # and macro/extension function injection points are reached in
    # WF-IMPL-005/006. See change record 005 for the decision rationale.
    "cel-python>=0.5.0,<0.6",
    # OpenTelemetry API only — no SDK requirement (WF-IMPL-011, #186).
    # Consumers without an OTel SDK installed get no-op spans and
    # metrics via the API's default no-op providers, so importing
    # ``custos_cel`` works unconditionally and ``parse`` /
    # ``type_check`` / ``evaluate`` add no measurable overhead.
    "opentelemetry-api>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Property-based tests live in ``tests/test_determinism_property.py``
    # (WF-IMPL-010, #185). The suite uses Hypothesis to generate
    # well-typed CEL expressions and assert replay-determinism
    # properties across at least 1000 examples.
    "hypothesis>=6.100",
    # OTel SDK is dev-only: tests in ``tests/test_observability.py``
    # (WF-IMPL-011, #186) install in-memory exporters to assert span
    # shape and metric emission. Production deployments wire their
    # own SDK; the library itself only depends on the API.
    "opentelemetry-sdk>=1.20,<2",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/workflow-service/design.md"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_cel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# celpy ships no PEP 561 marker as of 0.5.1; treat as untyped at our boundary.
module = ["celpy", "celpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
