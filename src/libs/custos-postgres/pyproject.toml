[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custos-postgres"
version = "0.1.0"
description = "Custos Postgres adapters for the Storage Provider Layer — Definition + Catalog stores in v1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]
keywords = ["custos", "storage", "providers", "postgres", "asyncpg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "custos-spl",
    "asyncpg>=0.29",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.0",
]

[project.urls]
Repository = "https://github.com/toddysm/custos"
Issues = "https://github.com/toddysm/custos/issues"
Design = "https://github.com/toddysm/custos/blob/main/design/components/storage-provider-layer/design.md"

# Adapters discovered by `custos-migrate` and the SPL startup gate.
# Each factory is a zero-arg callable returning a MigrationCapable instance.
[project.entry-points."custos_spl.adapters"]
postgres-definition = "custos_pg.adapters.definition:make_adapter"
postgres-catalog = "custos_pg.adapters.catalog:make_adapter"
postgres-metadata = "custos_pg.adapters.metadata:make_adapter"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_pg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:../storage-provider-layer/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# Tests pass plain string literals into dataclasses whose fields are
# typed as SPL ID NewTypes (e.g. `WorkspaceId = NewType(..., str)`).
# Wrapping every literal in its NewType constructor adds churn without
# catching real bugs — the runtime values are interchangeable with str.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres (skipped unless docker / CUSTOS_PG_DSN is available)",
]
