[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "custosctl"
version = "0.2.0"
description = "custosctl — local & remote dev/test CLI for the Custos platform (COMP-011)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Custos contributors" }]

# custosctl is an orchestration layer over the platform: it wraps kind /
# kubectl / helm (via subprocess) and drives the public Gateway/Catalog/
# Workflow APIs over HTTP. It links against no platform Python package.
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
custosctl = "custosctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custosctl"]

[tool.hatch.build.targets.wheel.force-include]
"src/custosctl/py.typed" = "custosctl/py.typed"
"src/custosctl/fixtures/sample-workflow.yaml" = "custosctl/fixtures/sample-workflow.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
